<title>City Limits</title>
<style>
:root{color-scheme:dark;--pink:#ff4fa0;--cyan:#4fe3ff;--ink:#ece8f6;--dim:#9a94b2;--panel:rgba(10,8,18,.82);--edge:rgba(255,255,255,.09)}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--ink);font:14px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#safe{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);visibility:hidden;pointer-events:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:none}
#hud{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#boot,#title{position:fixed;inset:0;display:grid;place-items:center;text-align:center}
#boot{background:#05040a;color:var(--dim);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
#boot b{color:var(--pink)}
#title{background:radial-gradient(ellipse 60% 45% at 50% 50%,rgba(4,3,9,.62),rgba(4,3,9,.25) 70%,rgba(4,3,9,.45));pointer-events:none}
#title .logo{font:800 clamp(44px,9vw,128px)/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;color:#fff;
  text-shadow:0 0 6px var(--pink),0 0 22px var(--pink),0 0 60px rgba(255,79,160,.6)}
#title .sub{margin-top:14px;letter-spacing:.38em;text-transform:uppercase;color:var(--cyan);font-weight:700;font-size:clamp(11px,1.4vw,16px);text-shadow:0 0 12px rgba(79,227,255,.6)}
#title .go{margin-top:44px;letter-spacing:.24em;text-transform:uppercase;font-size:13px;color:#fff;animation:pulse 1.6s ease-in-out infinite}
#title .keys{margin-top:26px;color:var(--dim);font-size:12px;line-height:1.9;letter-spacing:.06em}
#title .keys b{color:var(--ink);font-weight:700}
@keyframes pulse{50%{opacity:.35}}
#menu{position:fixed;inset:0;display:grid;place-items:center;background:rgba(3,2,8,.45);backdrop-filter:blur(3px)}
#menu .panel{width:min(760px,94vw);max-height:90vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--edge);border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#menu .ttl{padding:20px 26px 10px;font-weight:800;letter-spacing:.3em;color:#fff;text-shadow:0 0 14px var(--pink)}
#menu .rows{overflow:auto;padding:4px 14px 10px}
#menu .head{margin:16px 12px 6px;font-size:11px;letter-spacing:.32em;color:var(--pink);text-transform:uppercase}
#menu .row{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:6px 14px;padding:9px 12px;border-radius:4px;border:1px solid transparent;cursor:pointer;width:100%;box-sizing:border-box;
  background:none;color:var(--ink);font:inherit;text-align:left}
#menu .row.sel{border-color:rgba(255,79,160,.5);background:rgba(255,79,160,.08)}
#menu .row.act{display:block;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
#menu .lab{color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-size:12px}
#menu .desc{grid-column:2;color:var(--dim);font-size:12px}
#menu .chips{display:flex;flex-wrap:wrap;gap:6px}
#menu .chip{padding:5px 10px;border-radius:3px;border:1px solid var(--edge);background:rgba(255,255,255,.03);color:var(--ink);font:inherit;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px}
#menu .chip.on{border-color:var(--cyan);color:#fff;box-shadow:0 0 0 1px rgba(79,227,255,.35) inset;background:rgba(79,227,255,.1)}
#menu .chip i{width:12px;height:12px;border-radius:50%;background:var(--sw);display:inline-block;box-shadow:0 0 6px var(--sw)}
#menu .cyc{display:flex;align-items:center;gap:10px}
#menu .cyc b{min-width:220px;text-align:center;color:#fff}
#menu .arr{background:none;border:1px solid var(--edge);color:var(--ink);border-radius:3px;width:28px;height:26px;cursor:pointer;font-size:11px}
#menu input[type=range]{width:100%;accent-color:var(--pink)}
#menu .val{grid-column:2;color:var(--dim);font-size:12px}
#menu .foot{padding:10px 26px 16px;color:var(--dim);font-size:11px;letter-spacing:.08em;border-top:1px solid var(--edge)}
#menu button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
@media (max-width:620px){#menu .row{grid-template-columns:1fr}#menu .desc,#menu .val{grid-column:1}#menu .cyc b{min-width:0;flex:1}}

/* ---- touch controls ---- */
#touch,#rtouch{--r:max(14px,env(safe-area-inset-right));--l:max(14px,env(safe-area-inset-left));--bt:max(12px,env(safe-area-inset-bottom));--t:max(10px,env(safe-area-inset-top));
  --pw:100px;--ph:132px;--bw:88px;--bh:100px;--sh:52px;--g:10px;--tw:58px}
#touch{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none}
#touch .b{position:absolute;box-sizing:border-box;display:grid;place-items:center;border:1.5px solid rgba(236,232,246,.26);background:rgba(10,8,18,.30);border-radius:16px;
  color:rgba(236,232,246,.82);font:800 11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.16em;pointer-events:none;transition:background .06s,border-color .06s,box-shadow .06s}
#touch .b.on{background:rgba(255,79,160,.34);border-color:var(--pink);color:#fff;box-shadow:0 0 18px rgba(255,79,160,.45)}
#touch .k-thr{right:var(--r);bottom:var(--bt);width:var(--pw);height:var(--ph);border-color:rgba(93,255,122,.45);color:#c9ffd3}
#touch .k-thr.on{background:rgba(93,255,122,.30);border-color:#5dff7a;box-shadow:0 0 18px rgba(93,255,122,.45)}
#touch .k-nos{right:var(--r);bottom:calc(var(--bt) + var(--ph) + var(--g));width:var(--pw);height:var(--sh);border-color:rgba(79,227,255,.45);color:#cff6ff}
#touch .k-nos.on{background:rgba(79,227,255,.3);border-color:var(--cyan);box-shadow:0 0 18px rgba(79,227,255,.45)}
#touch .k-brk{right:calc(var(--r) + var(--pw) + var(--g));bottom:var(--bt);width:var(--bw);height:var(--bh);border-color:rgba(255,61,90,.45);color:#ffd0d8}
#touch .k-brk.on{background:rgba(255,61,90,.32);border-color:#ff3d5a;box-shadow:0 0 18px rgba(255,61,90,.45)}
#touch .k-hb{right:calc(var(--r) + var(--pw) + var(--g));bottom:calc(var(--bt) + var(--bh) + var(--g));width:var(--bw);height:var(--sh)}
#touch .sh{right:calc(var(--r) + var(--pw) + var(--bw) + 2*var(--g));width:56px;height:50px;font-size:22px;border-radius:12px}
#touch .k-up{bottom:calc(var(--bt) + 50px + var(--g))}#touch .k-down{bottom:var(--bt)}
#touch .tb{top:var(--t);width:var(--tw);height:40px;border-radius:10px;font-size:10px;letter-spacing:.12em}
#touch .k-pause{right:var(--r);font-size:14px;letter-spacing:.05em}#touch .k-reset{right:calc(var(--r) + var(--tw) + 8px)}#touch .k-cam{right:calc(var(--r) + 2*var(--tw) + 16px)}
#touch .st{left:var(--l);bottom:var(--bt);width:104px;height:96px;font-size:26px}#touch .k-right{left:calc(var(--l) + 104px + 12px)}
#touch .knob{position:absolute;left:0;top:0;pointer-events:none}
#touch .knob::before{content:'';position:absolute;left:-80px;top:-3px;width:160px;height:6px;border-radius:3px;background:rgba(236,232,246,.2)}
#touch .knob i{position:absolute;left:-28px;top:-28px;width:56px;height:56px;box-sizing:border-box;border-radius:50%;border:2px solid rgba(79,227,255,.75);background:rgba(79,227,255,.18);box-shadow:0 0 16px rgba(79,227,255,.4)}
#touch .shint{position:absolute;left:calc(var(--l) + 24px);bottom:calc(var(--bt) + 54px);color:rgba(236,232,246,.55);font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.22em;pointer-events:none;transition:opacity .8s}
#touch .shint.gone{opacity:0}
#rtouch{position:fixed;left:0;right:0;bottom:var(--bt);display:flex;justify-content:center;gap:8px;padding:0 var(--r) 0 var(--l)}
#rtouch button{min-width:64px;height:44px;padding:0 12px;border-radius:10px;border:1.5px solid rgba(236,232,246,.26);background:rgba(10,8,18,.5);color:var(--ink);font:800 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;touch-action:manipulation}
#rtouch button:active{background:rgba(255,79,160,.3);border-color:var(--pink)}
@media (max-height:360px){#touch,#rtouch{--ph:112px;--bh:86px;--sh:44px;--pw:92px;--bw:80px}}
@media (min-height:600px) and (pointer:coarse){#touch,#rtouch{--pw:120px;--ph:160px;--bw:104px;--bh:120px;--sh:60px;--tw:68px}}
#title .tkeys{display:none;margin-top:20px;color:var(--dim);font-size:12px;line-height:1.8;letter-spacing:.06em}#title .tkeys b{color:var(--ink)}
html.touch #title .keys{display:none}html.touch #title .tkeys{display:block}
html.touch #menu .foot{display:none}
html.touch #menu .chip{padding:8px 12px;font-size:12px}
html.touch #menu .arr{width:40px;height:36px}
html.touch #menu .row{cursor:default}
html.touch #menu{backdrop-filter:none;-webkit-backdrop-filter:none}
/* ---- turn the phone sideways ---- */
#rotate{position:fixed;inset:0;z-index:50;background:#05040a;display:none;place-items:center;text-align:center;color:var(--dim);letter-spacing:.16em;text-transform:uppercase;font-size:13px;font-weight:700}
#rotate b{display:block;color:#fff;font-size:22px;letter-spacing:.18em;margin:22px 0 8px;text-shadow:0 0 14px var(--pink)}
#rotate i{display:block;margin:0 auto;width:46px;height:80px;border:3px solid var(--pink);border-radius:9px;box-shadow:0 0 18px rgba(255,79,160,.5);animation:turn 2.4s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(0)}55%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:grid}}
/* ---- short landscape screens (phones) ---- */
@media (max-height:500px){
  #title .logo{font-size:clamp(30px,6.5vw,58px)}#title .sub{margin-top:6px;font-size:10px;letter-spacing:.3em}
  #title .keys,#title .tkeys{display:none!important}
  #menu .panel{max-height:94vh;max-height:94dvh;width:min(860px,96vw)}#menu .ttl{padding:10px 18px 4px}
  #menu .row{padding:6px 10px;grid-template-columns:118px 1fr}#menu .head{margin:10px 10px 4px}#menu .foot{display:none}#menu .desc{font-size:11px}
}
#perf{position:fixed;left:max(10px,env(safe-area-inset-left));top:44%;z-index:5;pointer-events:none;margin:0;padding:8px 10px;border-radius:6px;background:rgba(6,5,12,.72);color:#d9fbe1;font:600 12px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre;max-width:calc(100vw - 20px);overflow:hidden;text-overflow:ellipsis}
/* ---- City Limits: the title and the car picker ---- */
#title{display:block;background:linear-gradient(180deg,rgba(4,3,9,.55),rgba(4,3,9,0) 30%,rgba(4,3,9,0) 55%,rgba(4,3,9,.82))}
#title .top{position:absolute;left:0;right:0;top:max(18px,env(safe-area-inset-top));text-align:center}
#title .logo{font:800 clamp(34px,7vw,96px)/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;color:#fff;
  text-shadow:0 0 6px #ffb040,0 0 22px #ff7a1a,0 0 60px rgba(255,122,26,.55)}
#title .sub{margin-top:8px;letter-spacing:.42em;text-transform:uppercase;color:#9fd8ff;font-weight:700;font-size:clamp(10px,1.3vw,15px);text-shadow:0 0 12px rgba(120,200,255,.6)}
/* ---- City Limits: the title (career or free play) ---- */
#modes{pointer-events:auto;position:absolute;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 14px}
#modes .mrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#modes .mode{width:min(330px,44vw);padding:14px 18px;text-align:left;border-radius:8px;border:1px solid var(--edge);background:rgba(8,6,16,.72);color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px}
#modes .mode b{font-size:18px;letter-spacing:.24em;text-transform:uppercase;color:#fff}
#modes .mode span{color:var(--dim);font-size:12px;line-height:1.4}
#modes .mode em{font-style:normal;color:#5dff7a;font-size:12px;letter-spacing:.06em}
#modes .mode.career{border-color:rgba(255,176,64,.55);box-shadow:0 0 26px rgba(255,140,40,.18)}
#modes .mode.career b{text-shadow:0 0 12px #ff7a1a}
#modes .mode.free{border-color:rgba(79,227,255,.45)}
#modes .mode.free b{text-shadow:0 0 12px var(--cyan)}
#modes .mode:hover{background:rgba(20,14,34,.85)}
#modes .wipe{background:none;border:none;color:var(--dim);font:inherit;font-size:11px;letter-spacing:.1em;cursor:pointer;text-decoration:underline}
#modes .msmall{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#modes .msmall button,.gset button{font:700 10px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;border-radius:999px;border:1px solid var(--edge);background:rgba(10,8,18,.6);color:var(--ink);cursor:pointer}
#modes .msmall button.on,.gset button.on{border-color:#ffb040;color:#fff;background:rgba(255,160,60,.16)}
/* ---- the garage ---- */
#garage{position:fixed;inset:0;pointer-events:none;--gl:max(12px,env(safe-area-inset-left));--gr:max(12px,env(safe-area-inset-right));font-size:13px}
#garage button{font:inherit;cursor:pointer;color:var(--ink)}
#garage button:disabled{cursor:default}
#garage>*{pointer-events:auto}
.gtop{position:absolute;left:var(--gl);right:var(--gr);top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:14px}
.gback{width:38px;height:34px;border-radius:6px;border:1px solid var(--edge);background:rgba(8,6,16,.75);font-size:20px!important;line-height:1}
.gmode{letter-spacing:.24em;text-transform:uppercase;color:#fff;font-size:13px;text-shadow:0 0 12px #ff7a1a}
.gmoney{color:#5dff7a;font-weight:800;letter-spacing:.06em;font-size:15px}
.gmed{color:var(--dim);font-size:12px;letter-spacing:.06em}.gmed i{font-style:normal;margin-left:6px}
.md0,.gmed .m0{color:#ffd23f}.md1,.gmed .m1{color:#c8d0dc}.md2,.gmed .m2{color:#d88b4a}
.gload{display:none;color:#ffb040;font-size:11px;letter-spacing:.12em}#garage.busy .gload{display:inline}
.gdrive{margin-left:auto;padding:9px 26px;border-radius:999px;border:1px solid #5dff7a;background:rgba(93,255,122,.15);color:#fff!important;font-weight:800!important;letter-spacing:.24em;text-transform:uppercase;box-shadow:0 0 22px rgba(93,255,122,.28)}
.gcars{position:absolute;left:var(--gl);top:calc(max(10px,env(safe-area-inset-top)) + 46px);width:min(560px,52vw);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.gc{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--edge);background:rgba(8,6,16,.75);display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.gc b{letter-spacing:.14em;text-transform:uppercase;font-size:12px}.gc i{font-style:normal;font-size:10px;color:var(--dim)}
.gc.shop b{color:var(--dim)}.gc.on{border-color:#ffb040;background:rgba(255,160,60,.16)}.gc.on b{color:#fff}
.gmain{position:absolute;left:var(--gl);top:calc(max(10px,env(safe-area-inset-top)) + 92px);bottom:max(12px,env(safe-area-inset-bottom));width:min(560px,52vw);display:flex;flex-direction:column;gap:6px}
.gpanel{flex:1;min-height:0;overflow:auto;background:rgba(6,5,12,.8);border:1px solid var(--edge);border-radius:8px;padding:8px 10px;scrollbar-width:thin}
.gpre,.ggs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.gpre span{color:var(--dim);font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin-right:2px}
.gp,.gg{padding:5px 10px;border-radius:4px;border:1px solid var(--edge);background:rgba(255,255,255,.03);font-size:12px!important;display:flex;gap:6px;align-items:baseline}
.gp i{font-style:normal;color:var(--dim);font-size:10px}
.gp.on{border-color:var(--pink);background:rgba(255,79,160,.14);color:#fff!important}
.gg{letter-spacing:.12em;text-transform:uppercase;font-size:11px!important}.gg.on{border-color:var(--cyan);background:rgba(79,227,255,.12);color:#fff!important}
.gs{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:baseline;width:100%;text-align:left;padding:7px 6px;border:none;border-top:1px solid rgba(255,255,255,.05);background:none}
.gs span{color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase}.gs b{font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gs i{font-style:normal;color:var(--dim)}
.gs.on{background:rgba(255,255,255,.04)}
.gopts{display:flex;flex-direction:column;gap:2px;padding:2px 0 8px 10px}
.go{display:grid;grid-template-columns:auto 1fr auto;column-gap:8px;align-items:center;text-align:left;padding:6px 8px;border-radius:4px;border:1px solid transparent;background:rgba(255,255,255,.025)}
.go>b{grid-column:2;font-weight:600}.go>em{grid-column:3;font-style:normal;font-size:11px;color:var(--ink);white-space:nowrap}
.go>em.on{color:var(--cyan);font-weight:800;letter-spacing:.08em}.go>em.no{color:#ff8a9a;white-space:normal;text-align:right;max-width:150px}
.go>small{grid-column:2/4;color:var(--dim);font-size:11px;line-height:1.35}
.go>s{grid-column:1;width:14px;height:14px;border-radius:50%;background:var(--sw);box-shadow:0 0 8px var(--sw);text-decoration:none;border:1px solid rgba(255,255,255,.25)}
.go.on{border-color:rgba(79,227,255,.5);background:rgba(79,227,255,.08)}.go.nofit{opacity:.45}
.gdeal h3{margin:2px 0 6px;font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:#fff}.gdeal p{margin:0 0 10px;line-height:1.45;color:var(--ink)}
.gk{color:#ffb040;font-size:10px;letter-spacing:.24em;text-transform:uppercase}
.gwarn{color:#ffb040!important;font-size:12px}.gmsg{color:#5dff7a;margin:8px 0 0;font-size:12px}
.gbig{padding:9px 20px;border-radius:6px;border:1px solid #5dff7a;background:rgba(93,255,122,.16);color:#fff!important;font-weight:800!important;letter-spacing:.16em;text-transform:uppercase}
.gbig:disabled{opacity:.4}
.gbuy{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,176,64,.6);background:rgba(30,18,6,.9)}
.gbuy span{flex:1;font-size:12px}.gbuy span b{color:#ffd23f}.gbuy span em{font-style:normal;color:var(--dim)}
.gbuy button:not(.gbig){padding:8px 12px;border-radius:6px;border:1px solid var(--edge);background:rgba(255,255,255,.04)}
.gstats{position:absolute;right:var(--gr);bottom:max(12px,env(safe-area-inset-bottom));width:min(420px,40vw);box-sizing:border-box;background:rgba(6,5,12,.72);border:1px solid var(--edge);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:3px}
.gfig{font-size:12px;color:var(--ink);margin-bottom:3px}.gfig b{color:#fff}
.gr{display:grid;grid-template-columns:62px 1fr 22px 26px;gap:8px;align-items:center;font-size:11px}
.gr span{color:var(--dim);letter-spacing:.1em;text-transform:uppercase;font-size:10px}.gr b{text-align:right;color:#fff}
.gr i{font-style:normal;font-size:10px;font-weight:800}.gr i.up{color:#5dff7a}.gr i.dn{color:#ff6b7f}
.gbar{position:relative;height:6px;background:rgba(255,255,255,.08);border-radius:3px}
.gbar u{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#ff7a1a,#ffd23f)}
.gbar o{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;opacity:.7}
.gset{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.gset button{padding:4px 8px;font-size:9px}
/* ---- people, prompts, results ---- */
#dialog,#result{position:fixed;inset:0;display:grid;place-items:center;background:rgba(3,2,8,.35)}
.dcard{width:min(520px,90vw);max-height:90vh;max-height:90dvh;overflow:auto;box-sizing:border-box;background:rgba(8,6,16,.92);border:1px solid var(--edge);border-left:4px solid var(--c,#ffb040);border-radius:8px;padding:16px 20px;display:flex;flex-direction:column;gap:8px;box-shadow:0 20px 70px rgba(0,0,0,.6)}
.dwho b{font-size:17px;color:#fff;letter-spacing:.06em}.dwho span{color:var(--dim);font-size:12px;margin-left:8px}
.dtitle{color:var(--c,#ffb040);letter-spacing:.22em;text-transform:uppercase;font-size:11px;font-weight:800}
.dcard p{margin:0;line-height:1.5;font-size:14px}
.dcard .dreward{color:#5dff7a;font-weight:800;letter-spacing:.06em}
.dbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.dbtns button{padding:10px 18px;border-radius:6px;border:1px solid var(--edge);background:rgba(255,255,255,.04);color:var(--ink);font:inherit;font-weight:800;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.dbtns button.yes{border-color:#5dff7a;background:rgba(93,255,122,.15);color:#fff}
.rmedal{font-size:30px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;text-shadow:0 0 22px currentColor}
.rval{font-size:22px;color:#fff;font-weight:700}.rsub{color:var(--dim);font-size:12px}
.rmeds{display:flex;gap:14px;font-size:12px}.rmeds span{color:var(--dim)}.rmeds b{font-weight:700}
#obj{position:fixed;left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;max-width:min(560px,46vw);pointer-events:none;z-index:3}
#obj .job{background:rgba(6,5,12,.62);border-radius:6px;padding:4px 12px;text-align:center;font-size:12px;line-height:1.35}
#obj .job b{color:var(--c,#5dff7a);letter-spacing:.12em;text-transform:uppercase;font-size:10px;display:block}
#obj .job i{font-style:normal;color:#ffd23f;font-weight:800;margin-left:6px}
#obj .ask{pointer-events:auto;display:flex;align-items:center;gap:10px;background:rgba(8,6,16,.86);border:1px solid rgba(79,227,255,.55);border-radius:8px;padding:6px 8px 6px 12px;font-size:12px}
#obj .ask b{color:#fff;letter-spacing:.1em;text-transform:uppercase;font-size:12px}#obj .ask span{color:var(--dim);font-size:11px;display:block}
#obj .ask button{padding:8px 14px;border-radius:6px;border:1px solid var(--cyan);background:rgba(79,227,255,.16);color:#fff;font:inherit;font-weight:800;letter-spacing:.16em;cursor:pointer}
html.touch #obj{top:calc(max(8px,env(safe-area-inset-top)) + 46px)}
#menu .ch{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;padding:6px 12px;border-radius:4px}
#menu .ch b{color:#fff;font-weight:600}#menu .ch small{grid-column:1;color:var(--dim);font-size:11px}#menu .ch em{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
#menu .ch .chip{grid-row:1/3;grid-column:3}#menu .money{color:#5dff7a;font-weight:800;margin-left:14px;letter-spacing:.06em;text-shadow:none}
@media (max-height:500px){
  #modes{gap:6px}#modes .mode{padding:9px 14px}#modes .mode b{font-size:14px}#modes .mode span{font-size:10.5px}
  #garage{font-size:12px}.gtop{gap:10px}.gdrive{padding:7px 18px}.gcars{top:calc(max(8px,env(safe-area-inset-top)) + 42px)}.gc{padding:4px 10px}
  .gmain{top:calc(max(8px,env(safe-area-inset-top)) + 80px);bottom:max(8px,env(safe-area-inset-bottom))}.gpanel{padding:6px 8px}
  .gs{padding:5px 4px;grid-template-columns:92px 1fr auto}.go{padding:5px 6px}.go>small{font-size:10px}
  .gstats{padding:6px 10px;gap:2px 12px;bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;width:min(400px,41vw)}.gfig{grid-column:1/3;font-size:10.5px}.gset{display:none}
  .gr{font-size:10px;grid-template-columns:44px 1fr 18px 20px;gap:5px}.gr span{font-size:8.5px;letter-spacing:.06em}
  .dcard{padding:10px 14px;gap:5px}.dcard p{font-size:12.5px;line-height:1.4}.dbtns button{padding:8px 14px}.rmedal{font-size:22px}.rval{font-size:17px}
}
@media (max-width:700px){.gmain,.gcars{width:56vw}.gstats{width:40vw}.gset{display:none}}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);pointer-events:none;color:#fff;font:800 13px ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;text-shadow:0 0 12px var(--pink)}
[hidden]{display:none!important}
</style>
