<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dirt Sleeper Mini</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Dirt Sleeper Mini: the model bay. A lit dot-matrix sign in a dark shed, dark-only by design.
   The truck renders on Shiftlight 2's LED pipeline; the controls sit under it in a dock. */
:root{
  --bg:#07070b;--panel:#111119;--raised:#191924;--ink:#efeaf6;--ink-2:#a8a2b8;--ink-3:#6c6880;
  --edge:rgba(255,255,255,.12);--edge-2:rgba(255,255,255,.22);--accent:#ff3d5a;--amber:#ffb43c;--cyan:#4fe3ff;
  --f:"Chakra Petch","Arial Narrow",system-ui,sans-serif;--fb:"Saira",system-ui,-apple-system,sans-serif;color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font:400 13px/1.4 var(--fb);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
#sa{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.bar{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none;
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.brand{font:700 14px/1 var(--f);letter-spacing:.3em;color:var(--accent);text-shadow:0 0 12px rgba(255,61,90,.5);white-space:nowrap}
.brand span{color:var(--ink-2);letter-spacing:.2em;font-weight:500;font-size:10px;margin-left:8px;text-shadow:none}
@media (max-width:560px){.brand span{display:none}.brand{font-size:12px;letter-spacing:.2em}}
.opts{display:flex;gap:8px;align-items:center}
.chip{pointer-events:auto;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);cursor:pointer;
  font:600 10.5px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat{pointer-events:none;font:500 11px/1 var(--f);letter-spacing:.08em;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:640px){.stat{display:none}}
/* the dock */
#dock{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:8px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,rgba(7,7,11,.96) 70%,rgba(7,7,11,0));max-width:1280px;margin:0 auto}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pick{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.pick .seg{flex:none}
.builds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;flex:1 1 300px;min-width:0}
.bld{border:1px solid var(--edge);background:var(--panel);border-radius:10px;padding:8px 10px 7px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.bld b{font:700 13px/1 var(--f);letter-spacing:.12em;text-transform:uppercase}
.bld small{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bld[aria-pressed="true"]{border-color:var(--accent);background:linear-gradient(180deg,rgba(255,61,90,.16),var(--panel));}
.bld[aria-pressed="true"] small{color:var(--ink-2)}
@media (max-width:560px){.bld small{display:none}.bld b{font-size:11px;letter-spacing:.06em}}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:999px;padding:2px;background:var(--panel);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;height:28px;padding:0 10px;border-radius:999px;cursor:pointer;font:600 10.5px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 0 0 1px var(--edge-2) inset}
.tog{height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--edge);background:var(--panel);cursor:pointer;font:600 10.5px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.tog[aria-pressed="true"]{color:var(--amber);border-color:rgba(255,180,60,.6)}
.tog.cmp[aria-pressed="true"]{color:var(--cyan);border-color:rgba(79,227,255,.6)}
.sw{display:inline-flex;gap:5px;align-items:center;padding:0 2px}
.sw button{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.15);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--ink-2)}
.mud{display:inline-flex;align-items:center;gap:7px;font:600 10.5px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.mud input{width:90px;accent-color:#9a6a32}
.info{margin:0;color:var(--ink-2);font-size:12px;max-width:110ch}
.info b{color:var(--ink);font-weight:500}
.info .st{color:var(--ink-3)}
.spacer{flex:1}
.inl{display:contents}
.tabs button[aria-pressed="true"]{color:var(--accent)}
.tog kbd,.keys kbd{font:600 9.5px/1 var(--f);color:var(--ink-3);border:1px solid var(--edge);border-radius:4px;padding:2px 4px;margin-left:6px}
.keys kbd{margin:0 1px}
.tog.on{color:var(--amber);border-color:rgba(255,180,60,.75);background:var(--raised)}
.tog[data-tone="red"].on{color:var(--accent);border-color:rgba(255,61,90,.75)}
.tog[data-tone="cyan"].on{color:var(--cyan);border-color:rgba(79,227,255,.75)}
.tog:disabled{opacity:.35;cursor:default}
.power{display:inline-flex;align-items:center;gap:7px;color:var(--ink)}
.power i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.power[aria-pressed="true"]{border-color:rgba(93,255,122,.6)}
.power[aria-pressed="true"] i{background:#5dff7a;box-shadow:0 0 8px #5dff7a}
.pad{position:relative;flex:1 1 240px;min-width:150px;height:40px;border-radius:10px;border:1px solid var(--edge-2);background:var(--panel);overflow:hidden;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.padFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(255,180,60,.15),rgba(255,180,60,.55) 70%,rgba(255,61,90,.75))}
.pad span{position:absolute;inset:0;display:grid;place-items:center;font:600 10.5px/1 var(--f);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);pointer-events:none;text-align:center;padding:0 8px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.keys{font-size:11px;color:var(--ink-3);line-height:1.9}
@media (hover:none),(max-width:720px){.keys{display:none}.tog kbd{display:none}}
.mud.vol input{accent-color:var(--amber)}

:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#err{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;font:500 14px/1.6 var(--f);color:var(--ink-2)}
</style>

  </div>

  </div>
  <p class="info" id="info"></p>
</div>

<script>
(()=>{
'use strict';
/* ===== core: basics, bitmap fonts and the HUD pixel buffer, from Shiftlight 2 ===== */
/* =====================================================================================
   1. BASICS
   ===================================================================================== */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),TAU=Math.PI*2,PI=Math.PI;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const sgn=v=>v<0?-1:v>0?1:0;
const wrapA=a=>{while(a>PI)a-=TAU;while(a<-PI)a+=TAU;return a;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,String(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const touchy=matchMedia('(hover: none)').matches;
const fmt=n=>Math.floor(n).toLocaleString('en-US');
const money=n=>'$'+fmt(Math.round(n));
const pick=a=>a[(Math.random()*a.length)|0];
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function hexRGB(h){const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
/* sRGB hex -> linear float triple (for the GPU) */
function lin(h,k=1){const c=hexRGB(h);return [Math.pow(c[0]/255,2.2)*k,Math.pow(c[1]/255,2.2)*k,Math.pow(c[2]/255,2.2)*k];}
const c255=v=>v<0?0:v>255?255:v|0;
const pack=(r,g,b,a=255)=>(((a&255)<<24)|(c255(b)<<16)|(c255(g)<<8)|c255(r))>>>0;
const hx=(h,a=255)=>{const c=hexRGB(h);return pack(c[0],c[1],c[2],a);};
function mixC(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}

const fmtT=(t,dp=2)=>{if(!(t>=0)||t>5999)return '--:--';const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(dp);};
const fmtS=(t,dp=3)=>(t>=0?t.toFixed(dp):'-.---');

/* ---- tiny vector / matrix kit (column-major mat4 for GL) ---- */
const V3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,k)=>[a[0]*k,a[1]*k,a[2]*k],dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.hypot(a[0],a[1],a[2]),norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];},
  lerp:(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]
};
const M4={
  id(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m;},
  persp(fovy,asp,n,f){const t=1/Math.tan(fovy/2),m=new Float32Array(16);m[0]=t/asp;m[5]=t;m[10]=(f+n)/(n-f);m[11]=-1;m[14]=2*f*n/(n-f);return m;},
  look(e,c,up){
    const z=V3.norm(V3.sub(e,c)),x=V3.norm(V3.cross(up,z)),y=V3.cross(z,x),m=new Float32Array(16);
    m[0]=x[0];m[4]=x[1];m[8]=x[2];m[1]=y[0];m[5]=y[1];m[9]=y[2];m[2]=z[0];m[6]=z[1];m[10]=z[2];
    m[12]=-V3.dot(x,e);m[13]=-V3.dot(y,e);m[14]=-V3.dot(z,e);m[15]=1;return m;
  },
  mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;},
  inv(m){const a=m,o=new Float32Array(16);
    const b0=a[0]*a[5]-a[1]*a[4],b1=a[0]*a[6]-a[2]*a[4],b2=a[0]*a[7]-a[3]*a[4],b3=a[1]*a[6]-a[2]*a[5],b4=a[1]*a[7]-a[3]*a[5],b5=a[2]*a[7]-a[3]*a[6],
      b6=a[8]*a[13]-a[9]*a[12],b7=a[8]*a[14]-a[10]*a[12],b8=a[8]*a[15]-a[11]*a[12],b9=a[9]*a[14]-a[10]*a[13],b10=a[9]*a[15]-a[11]*a[13],b11=a[10]*a[15]-a[11]*a[14];
    let d=b0*b11-b1*b10+b2*b9+b3*b8-b4*b7+b5*b6;if(!d)return M4.id();d=1/d;
    o[0]=(a[5]*b11-a[6]*b10+a[7]*b9)*d;o[1]=(a[2]*b10-a[1]*b11-a[3]*b9)*d;o[2]=(a[13]*b5-a[14]*b4+a[15]*b3)*d;o[3]=(a[10]*b4-a[9]*b5-a[11]*b3)*d;
    o[4]=(a[6]*b8-a[4]*b11-a[7]*b7)*d;o[5]=(a[0]*b11-a[2]*b8+a[3]*b7)*d;o[6]=(a[14]*b2-a[12]*b5-a[15]*b1)*d;o[7]=(a[8]*b5-a[10]*b2+a[11]*b1)*d;
    o[8]=(a[4]*b10-a[5]*b8+a[7]*b6)*d;o[9]=(a[1]*b8-a[0]*b10-a[3]*b6)*d;o[10]=(a[12]*b4-a[13]*b2+a[15]*b0)*d;o[11]=(a[9]*b2-a[8]*b4-a[11]*b0)*d;
    o[12]=(a[5]*b7-a[4]*b9-a[6]*b6)*d;o[13]=(a[0]*b9-a[1]*b7+a[2]*b6)*d;o[14]=(a[13]*b1-a[12]*b3-a[14]*b0)*d;o[15]=(a[8]*b3-a[9]*b1+a[10]*b0)*d;return o;},
  /* rigid transform from a basis: forward f, up u, right r (unit vectors) and position p. Local +X=fwd, +Y=up, +Z=right */
  basis(p,f,u,r){const m=new Float32Array(16);m[0]=f[0];m[1]=f[1];m[2]=f[2];m[4]=u[0];m[5]=u[1];m[6]=u[2];m[8]=r[0];m[9]=r[1];m[10]=r[2];m[12]=p[0];m[13]=p[1];m[14]=p[2];m[15]=1;return m;},
  xform(m,p){return [m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12],m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13],m[2]*p[0]+m[6]*p[1]+m[10]*p[2]+m[14]];}
};
/* yaw convention used everywhere: forward(yaw) = (cos, 0, -sin); positive yaw turns LEFT */
const fwdOf=a=>[Math.cos(a),0,-Math.sin(a)],leftOf=a=>[-Math.sin(a),0,-Math.cos(a)];

/* =====================================================================================
   2. BITMAP FONTS — 5x7 and 3x5, extended with $ % # ( ) = * arrows and a star

/* =====================================================================================

   every running sim takes four steps, its events go to its synth, then one set of params, exactly
   as the lab does it. Only the car on the turntable hears the throttle; the rest idle where they
   are parked.
   ===================================================================================== */

/* ---------- from the lab: the room ---------- */
function roomIR(ctx,kind){
  const sr=ctx.sampleRate,n=Math.round(sr*{open:.5,garage:1.2,tunnel:2.4}[kind]),b=ctx.createBuffer(2,n,sr);let seed=1234567;
  const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647*2-1;};
  for(let ch=0;ch<2;ch++){const X=b.getChannelData(ch);let lp=0;
    if(kind==='tunnel'){
      /* flutter echoes bouncing between the walls, each a little duller, then a long diffuse tail */
      for(let k=1;k<44;k++){const i=Math.round((k*.036+(k&1?ch*.011:0)+rnd()*.0015)*sr);if(i>=n)break;const a=Math.pow(.8,k)*(((k+ch)&1)?.55:1);
        for(let q=0;q<90&&i+q<n;q++)X[i+q]+=a*Math.exp(-q/(5+k*1.4))*(q?rnd()*.6:1);}
      for(let i=0;i<n;i++){const t=i/sr;lp+=.3*(rnd()-lp);X[i]+=lp*.55*Math.exp(-t*2.5)*Math.min(1,t/.03);}
    }else if(kind==='garage'){
      for(const [t,a] of [[.007,.7],[.013,.5],[.019,.45],[.026,.35],[.034,.3],[.041,.28]])X[Math.round((t+ch*.0013)*sr)]+=a*(rnd()>0?1:-1);
      for(let i=0;i<n;i++){const t=i/sr;lp+=.45*(rnd()-lp);X[i]+=lp*.5*Math.exp(-t*5.8)*Math.min(1,t/.012);}
    }else{
      /* open air: a ground bounce and the slap off a distant wall */
      X[Math.round((.0045+ch*.0006)*sr)]+=.5;
      for(const [t,a,d] of [[.085,.22,12],[.16,.12,18]]){const s=Math.round((t+ch*.005)*sr);for(let q=0;q<80;q++)X[s+q]+=a*Math.exp(-q/d)*rnd();}
      for(let i=0;i<n;i++){const t=i/sr;lp+=.25*(rnd()-lp);X[i]+=lp*.12*Math.exp(-t*9)*Math.min(1,t/.02);}
    }}
  return b;
}
const ROOM_SEND={open:.28,garage:.5,tunnel:.8};
function setRoom(){if(!ENG.audio)return;const a=ENG.audio;a.conv.buffer=roomIR(a.ctx,ENG.room);a.send.gain.setTargetAtTime(ROOM_SEND[ENG.room]*(ENG.listener===1?.35:1),a.ctx.currentTime,.05);}

/* ---------- from the lab: the audio graph, the synth in an audio worklet ---------- */
async function initAudio(){
  if(ENG.audio)return ENG.audio;
  /* starting every car at once asks for the graph several times over; they all wait on the one */
  if(!ENG.init)ENG.init=(async()=>{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('This browser has no Web Audio.');
    const ctx=new AC({latencyHint:'interactive'});
    const master=ctx.createGain();master.gain.value=ENG.vol;
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-8;comp.knee.value=6;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.15;
    master.connect(comp);comp.connect(ctx.destination);
    const send=ctx.createGain();send.gain.value=0;const conv=ctx.createConvolver();send.connect(conv);conv.connect(master);
    let worklet=false,kind;
    try{
      if(!ctx.audioWorklet)throw new Error('no worklet');
      /* the lab's processor, plus a nap: a parked engine that is off stops costing anything */
      const src=`const EngineDSP=(${makeDSP.toString()})();
class DigitalEngine extends AudioWorkletProcessor{
  constructor(){super();this.d=new EngineDSP(sampleRate);this.k=0;this.zz=false;
    this.port.onmessage=e=>{const m=e.data;if(m.t==='cfg')this.d.configure(m.cfg);else if(m.t==='p')this.d.set(m.p);else if(m.t==='ev')this.d.event(m.ev);else if(m.t==='sleep')this.zz=!!m.v;};}
  process(i,o){if(this.zz)return true;const out=o[0];this.d.process(out[0],out[1]||out[0],out[0].length);if(++this.k>=8){this.k=0;const s=this.d.takeStats();if(s)this.port.postMessage(s);}return true;}
}
registerProcessor('digital-engine',DigitalEngine);`;
      /* a blob URL where the page has a real origin; a data URL where it does not (a file opened from disk) */
      try{await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([src],{type:'application/javascript'})));}
      catch(e1){await ctx.audioWorklet.addModule('data:application/javascript;charset=utf-8,'+encodeURIComponent(src));}
      worklet=true;kind='audio worklet';
    }catch(err){kind='main-thread fallback ('+(err&&err.message||err)+')';}
    ENG.audio={ctx,master,comp,send,conv,worklet,kind};
    setRoom();
    ENG.status=`Digital Engine synth running live in an ${kind} at ${(ctx.sampleRate/1000).toFixed(1)} kHz.`;
    return ENG.audio;
  })();
  try{return await ENG.init;}finally{ENG.init=null;}
}
/* one car's synth, made the first time its engine starts */
function voiceNode(v){
  if(v.port)return;const a=ENG.audio,ctx=a.ctx;let node=null,port;
  if(a.worklet)try{node=new AudioWorkletNode(ctx,'digital-engine',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2]});
    const np=node.port;np.onmessage=e=>onStats(v,e.data);port={post:m=>np.postMessage(m)};}catch(e){node=null;}
  if(!node){
    /* fallback: the same synth on the main thread */
    const D=makeDSP(),d=new D(ctx.sampleRate);let zz=false;node=ctx.createScriptProcessor(1024,1,2);
    const silent=ctx.createConstantSource?ctx.createConstantSource():null;if(silent){silent.offset.value=0;silent.connect(node);silent.start();}
    node.onaudioprocess=ev=>{const b=ev.outputBuffer;if(zz){b.getChannelData(0).fill(0);b.getChannelData(1).fill(0);return;}
      d.process(b.getChannelData(0),b.getChannelData(1),b.length);const s=d.takeStats();if(s)onStats(v,s);};
    port={post:m=>{if(m.t==='cfg')d.configure(m.cfg);else if(m.t==='p')d.set(m.p);else if(m.t==='ev')d.event(m.ev);else if(m.t==='sleep')zz=!!m.v;}};
  }
  node.connect(a.master);node.connect(a.send);

/* a bang in the pipes lights the bang chip and throws a flame out of the tips */
function onStats(v,s){if(s.pops){v.popT=performance.now();v.flame=Math.min(1.4,v.flame+.45+.25*s.pops);v.flameL=.55+Math.random()*.6;}}
async function startEngine(v=cur()){

  try{await initAudio();if(ENG.audio.ctx.state!=='running')await ENG.audio.ctx.resume();voiceNode(v);
    if(v.asleep){v.asleep=false;v.port.post({t:'sleep',v:0});}v.offT=0;v.sim.start();}
  catch(e){ENG.status='Sound could not start: '+e.message;}

function toggleEngine(){const v=cur();if(!v.port||!runs(v))startEngine(v);else{v.sim.stop();engineLive(true);}}
const engineOn=()=>runs(cur());

/* ---------- a car's engine: the lab's applySpec, for whichever build that car is on ---------- */

}
function setListener(v){ENG.listener=+v;setRoom();saveEng();}
function setRoomKind(v){ENG.room=v;setRoom();saveEng();}

/* ---------- hands and feet (the lab's car controls) ---------- */
const ENG_BTNS=[
  {id:'brake',l:'Brake',k:'KeyS',t:'hold',drive:1,tone:'red'},{id:'down',l:'Shift down',k:'KeyQ',t:'tap',drive:1},{id:'up',l:'Shift up',k:'KeyE',t:'tap',drive:1},
  {id:'nos',l:'Nitrous',k:'KeyN',t:'hold',tone:'cyan',need:e=>e.nosKw},{id:'purge',l:'Purge',k:'KeyP',t:'tap',need:e=>e.nosKw},{id:'blip',l:'Blip',k:'KeyB',t:'tap'}];
const ENG_ACT={up:()=>ENG.sim.shift(1),down:()=>ENG.sim.shift(-1),purge:()=>{const v=cur();if(v.port)v.port.post({t:'ev',ev:{type:'purge'}});},blip:()=>{ENG.blipT=.22;}};
function engHold(d,v){if(d.el)d.el.classList.toggle('on',v);if(d.id==='brake')ENG.brkBtn=v;else if(d.id==='nos')ENG.nos=v;}
function engPress(d){if(d.el&&d.el.disabled)return;if(ENG_ACT[d.id])ENG_ACT[d.id]();}
function readInput(dt){
  let thr=ENG.keys.has('thr')?1:0;
  for(const d of ENG.digits)thr=Math.max(thr,d/10);
  if(ENG.padOn)thr=Math.max(thr,ENG.pad);
  if(ENG.blipT>0){ENG.blipT-=dt;thr=1;}

const typing=t=>t&&(t.tagName==='SELECT'||t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&t.type!=='range'));
addEventListener('keydown',e=>{
  if(!ENG.sim||typing(e.target)||e.metaKey||e.ctrlKey||e.altKey)return;
  const c=e.code,onRange=e.target&&e.target.type==='range';
  const d=ENG_BTNS.find(x=>x.k===c&&x.el&&!x.el.hidden);
  if(d){e.preventDefault();if(d.t==='hold'){if(!e.repeat)engHold(d,true);}else if(!e.repeat)engPress(d);return;}
  if(c==='Space'||c==='KeyW'||(c==='ArrowUp'&&!onRange)){e.preventDefault();ENG.keys.add('thr');return;}
  if(c==='KeyS'||(c==='ArrowDown'&&!onRange)){e.preventDefault();ENG.keys.add('brk');return;}
  if(/^Digit\d$/.test(c)){ENG.digits.add(+c.slice(5)||10);return;}

});
addEventListener('keyup',e=>{const c=e.code;
  const d=ENG_BTNS.find(x=>x.k===c);if(d&&d.t==='hold'){engHold(d,false);return;}
  if(c==='Space'||c==='KeyW'||c==='ArrowUp'){ENG.keys.delete('thr');if(c==='Space'&&!typing(e.target))e.preventDefault();}
  if(c==='KeyS'||c==='ArrowDown')ENG.keys.delete('brk');

/* ---------- the loop: the lab's frame, minus its instruments, once for every car that is running ---------- */
const IDLE={thr:0,brk:0,nos:false};
function engineFrame(dt){
  const sel=cur();if(!sel.sim)return;
  const inp=readInput(dt);
  for(const car in VOICES){
    const v=VOICES[car],sim=v.sim,mine=v===sel;if(!sim)continue;
    /* a parked car that has never run has nothing to do */
    if(!mine&&!v.port&&sim.st==='off')continue;
    const vi=mine?inp:IDLE;for(let k=0;k<4;k++)sim.step(dt/4,vi);
    const ev=sim.takeEvents();
    if(v.port){
      /* an engine that has been off a while sleeps in its worklet until it is started again */
      v.offT=sim.st==='off'?v.offT+dt:0;const nap=v.offT>2;
      if(nap!==v.asleep){v.asleep=nap;v.port.post({t:'sleep',v:nap?1:0});}
      if(!nap){for(const e of ev)v.port.post({t:'ev',ev:e});v.port.post({t:'p',p:voiceParams(v,mine,dt)});}}
    if(sim.stalled){sim.stalled=false;if(mine)ENG.status='It stalled. Start it again with the button or I.';}
    v.inp=vi;

}
/* the car answers: torque rocks the body on its springs, acceleration squats it, the wheels turn */
function bodyFrame(v,dt){
  const sim=v.sim,e=v.spec,run=sim.running,Te=run?Math.max(-e.tq*.3,SIM.engTq(e,Math.max(sim.rpm,1),sim.thr,sim.boost)):0;
  const rollT=-.02*Te/e.peak.tq,pitchT=sim.mode==='drive'?clamp(sim.aPrev/9.81,-1,1)*.014:0;
  v.rollV+=(-(v.roll-rollT)*80-v.rollV*6.5)*dt;v.roll+=v.rollV*dt;
  v.pitchV+=(-(v.pitch-pitchT)*60-v.pitchV*7)*dt;v.pitch+=v.pitchV*dt;
  const idle=run?1-clamp((sim.rpm-e.idle)/(e.idle*1.5),0,1):0,lope=[0,.012,.032,.065][e.cam|0],amp=run?(.0004+lope*.03*idle+.0003*sim.load):0;
  v.shake=[(Math.random()-.5)*amp,(Math.random()-.5)*amp*1.6];
  v.wheelA=(v.wheelA+(sim.mode==='drive'?sim.ww:0)*dt)%(TAU*1000);
  v.flame=Math.max(0,v.flame-dt*9);
}
/* where a car is heard from. The one on the turntable is heard the way the listener buttons say.
   A parked car is heard from the camera: from the side it is on, in front of it or behind it, and
   as far off as it is (a little nearer, the shed is a small room). How fast that distance can change
   is held down, so the camera flying across the shed does not bend the pitch. Out of the garage only
   the car on the turntable is heard. */
function voiceParams(v,mine,dt){
  const p=v.sim.params(mine?ENG.listener:0,1);
  if(mine){v.dist=-1;return p;}
  if(!APP.garage||!CAMNOW){p.vol=0;return p;}
  const s=spotOf(v.car),c=CAMNOW,dx=s.p[0]-c.eye[0],dy=.6-c.eye[1],dz=s.p[2]-c.eye[2],d=Math.hypot(dx,dy,dz)||1,t=Math.max(3,d*.6);
  v.dist=v.dist<0?t:v.dist+clamp(t-v.dist,-8*dt,8*dt);
  const f=[Math.cos(s.yaw),-Math.sin(s.yaw)];
  p.dist=v.dist;p.pan=clamp((dx*c.right[0]+dz*c.right[2])/d*.9,-.9,.9);p.rear=clamp(.5+.5*(f[0]*dx+f[1]*dz)/d,0,1);

/* every car in the shed at once */
function allEngines(on){
  for(const [car] of CARS){const v=engineFor(carBuild(car));if(on&&!runs(v))startEngine(v);else if(!on&&runs(v))v.sim.stop();}
  engineLive(true);

/* ---------- the dot-matrix instruments: Shiftlight 2's shift lights, tach, gear and speed ---------- */
function engShiftLights(x,y,e,rpm,n=15){
  const sAt=e.shiftRpm,lo=sAt-Math.min(3500,sAt*.42),f=clamp((rpm-lo)/(sAt-lo),0,1),lit=Math.floor(f*n+.001),over=rpm>=sAt-40&&ENG.sim.running,blink=(APP.t*14|0)%2;
  for(let i=0;i<n;i++){const cx=x+i*6,on=i<lit;
    let col=i<5?[60,255,90]:i<10?[255,210,40]:[255,50,60];if(over)col=[80,140,255];
    const c=(over?blink:on)?pack(col[0],col[1],col[2]):pack(col[0]*.12,col[1]*.12,col[2]*.12);
    hDisc(cx+2,y+2,2.3,c);if(over?blink:on)hPx(cx+1,y+1,PAL.white);}
}
function engTach(cx,cy,r,e,rpm){
  const lim=e.limiterRpm,n=34,a0=PI*1.12,a1=-PI*.12;

/* =====================================================================================
   PARTS — everything bolted to the shell: arch flares, the chassis underneath, roof rails and
   racks, spoilers and wings, bumpers, lips, sliders, exhausts, hoods, lights and livery.
   ===================================================================================== */
function buildParts(K){
  const lk=K.D.look;
  underbody(K);flares(K);roof(K);spoiler(K);exhausts(K);
  if(FRONTS[lk.front])FRONTS[lk.front](K);if(REARS[lk.rear])REARS[lk.rear](K);
  if(HOODS[lk.hood])HOODS[lk.hood](K);
  for(const x of lk.extras||[])if(EXTRAS[x])EXTRAS[x](K);
}
/* ---------- arch flares: a band round each opening, standing off the body side ---------- */
function flares(K){

  const n=28,w=F.w,o=F.out,sec=[[-.012,-.01],[0,o*.7],[w*.18,o],[w*.62,o*.86],[w,o*.12],[w+.012,0]];
  const m=F.mat||MM.CLAD;

    const G=[];
    for(let k=0;k<=n;k++){const ph=(F.a0||-.01)+((F.a1||1.01)-(F.a0||-.01))*k/n,end=sm01(Math.min(k,n-k)/(n*.1)),row=[];

    for(const k of [0,n]){const r=G[k];for(let j=1;j<r.length-1;j++)pm.tri(r[0],r[j],r[j+1],m[0],m[1],m[2]);}
    if(F.bolts)for(let k=2;k<n-1;k+=3){const ph=(F.a0||-.01)+((F.a1||1.01)-(F.a0||-.01))*k/n,[u,y]=archPt(D,ua,ph*PI,w*.45);
      ball(pm,[X(u),y,s*(sideZ(u,y)+o*.95)],.011,6,MM.CHROME);}
  }
}

    for(let k=-3;k<=3;k++){const z=k/3*w,yy=topY(u,z)+h*Math.pow(Math.cos(k/3*PI/2),.35)+.002;row.push([X(u),yy,z]);}rows.push(row);}
  for(let i=0;i<n;i++)for(let k=0;k<6;k++)pm.quad(rows[i][k],rows[i+1][k],rows[i+1][k+1],rows[i][k+1],[1,1,1],0,MAT.PAINT);

/* =====================================================================================
   WHEELS AND TYRES. One mesh per build, drawn four times. Local axes: the axle along z with
   the wheel's face at +z (the left side is drawn mirrored), spin about z.
   Tyres: highway all-season, low-profile performance, mud-terrain with real lugs, race slick.
   Wheels: the factory six-spoke, a ten-spoke, a beadlock with a bolt ring, a centre-lock.
   ===================================================================================== */
const WHEELMESH={};
function buildWheel(w){
  const key=JSON.stringify(w);if(WHEELMESH[key])return WHEELMESH[key];
  const mb=new MB(),R=w.R,W=w.W,rimR=w.rim*.0254/2,seg=w.tyre==='mt'?40:36;
  const TY=[.032,.032,.034];
  /* ---------- the tyre: a revolved profile (r, z), inner bead to outer bead ---------- */
  const hw=W/2,sh=R-rimR;let prof;
  if(w.tyre==='slick')prof=[[rimR+.012,-hw*.86],[rimR+.03,-hw*.98],[R-.05,-hw],[R-.012,-hw*.93],[R,-hw*.8],[R,hw*.8],[R-.012,hw*.93],[R-.05,hw],[rimR+.03,hw*.98],[rimR+.012,hw*.86]];
  else if(w.tyre==='perf'){const g=(z)=>[[R,z-.012],[R-.007,z-.008],[R-.007,z+.008],[R,z+.012]];
    prof=[[rimR+.012,-hw*.86],[rimR+.025,-hw*.98],[R-.035,-hw],[R-.008,-hw*.94],[R,-hw*.84],...g(-hw*.36),...g(hw*.36),[R,hw*.84],[R-.008,hw*.94],[R-.035,hw],[rimR+.025,hw*.98],[rimR+.012,hw*.86]];}
  else if(w.tyre==='at')prof=[[rimR+.012,-hw*.85],[rimR+.03,-hw*.97],[R-.085,-hw*1.01],[R-.035,-hw*.97],[R-.016,-hw*.88],[R-.016,hw*.88],[R-.035,hw*.97],[R-.085,hw*1.01],[rimR+.03,hw*.97],[rimR+.012,hw*.85]];
  else if(w.tyre==='mt')prof=[[rimR+.012,-hw*.84],[rimR+.03,-hw*.97],[R-.1,-hw*1.02],[R-.045,-hw*.98],[R-.026,-hw*.9],[R-.026,hw*.9],[R-.045,hw*.98],[R-.1,hw*1.02],[rimR+.03,hw*.97],[rimR+.012,hw*.84]];
  else{const g=(z)=>[[R,z-.01],[R-.007,z-.007],[R-.007,z+.007],[R,z+.01]];
    prof=[[rimR+.012,-hw*.86],[rimR+.03,-hw*.97],[R-.07,-hw*1.01],[R-.025,-hw*.97],[R-.004,-hw*.82],...g(-hw*.4),...g(0),...g(hw*.4),[R-.004,hw*.82],[R-.025,hw*.97],[R-.07,hw*1.01],[rimR+.03,hw*.97],[rimR+.012,hw*.86]];}
  /* the tread's sipes are drawn by the shader: em carries the outer radius */
  const tread=w.tyre==='slick'||w.tyre==='mt'||w.tyre==='at'?0:R;
  for(let i=0;i<seg;i++){const a=i/seg*TAU,b=(i+1)/seg*TAU,ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b);
    for(let k=0;k<prof.length-1;k++){const p=prof[k],q=prof[k+1];mb.quad([ca*p[0],sa*p[0],p[1]],[cb*p[0],sb*p[0],p[1]],[cb*q[0],sb*q[0],q[1]],[ca*q[0],sa*q[0],q[1]],TY,tread,MAT.TYRE);}}
  /* mud-terrain lugs: two staggered rows of blocks across the tread, and shoulder lugs down the sidewalls */
  const blk=(a0,a1,r0,r1,z0,z1)=>{
    const P=(a,r,z)=>[Math.cos(a)*r,Math.sin(a)*r,z],f=(p,q,s,t)=>mb.quad(p,q,s,t,TY,0,MAT.TYRE);
    const A=[P(a0,r0,z0),P(a1,r0,z0),P(a1,r0,z1),P(a0,r0,z1)],B=[P(a0,r1,z0),P(a1,r1,z0),P(a1,r1,z1),P(a0,r1,z1)];
    f(B[0],B[1],B[2],B[3]);f(A[0],A[1],B[1],B[0]);f(A[2],A[3],B[3],B[2]);f(A[1],A[2],B[2],B[1]);f(A[3],A[0],B[0],B[3]);};
  /* all-terrain: smaller blocks in three staggered rows with sipes between, and short shoulder blocks */
  if(w.tyre==='at'){const np=30,p=TAU/np,d=.016;
    for(let i=0;i<np;i++){const a=i*p;
      blk(a,a+p*.62,R-d,R,hw*.36,hw*.9);blk(a+p*.5,a+p*1.12,R-d,R,-hw*.9,-hw*.36);blk(a+p*.25,a+p*.8,R-d,R,-hw*.28,hw*.28);
      for(const s of [1,-1]){const a0=a+(s>0?0:p*.5);blk(a0,a0+p*.5,R-.075,R-.02,s*hw*.97,s*hw*1.02);}}}
  if(w.tyre==='mt'){const np=21;
    for(let i=0;i<np;i++){const p=TAU/np,a=i*p;
      blk(a,a+p*.55,R-.028,R,hw*.06,hw*.9);blk(a+p*.5,a+p*1.05,R-.028,R,-hw*.9,-hw*.06);
      blk(a+p*.2,a+p*.38,R-.028,R-.004,-hw*.12,hw*.12);
      /* shoulder lugs on both sidewalls */
      for(const s of [1,-1]){const a0=a+(s>0?0:p*.5),a1=a0+p*.42,P=(aa,r,z)=>[Math.cos(aa)*r,Math.sin(aa)*r,z],z0=s*hw*.98,z1=s*hw*1.07,r0=R-.115,r1=R-.03;
        const f=(p1,q,s2,t)=>mb.quad(p1,q,s2,t,TY,0,MAT.TYRE);
        f(P(a0,r0,z1),P(a1,r0,z1),P(a1,r1,z1),P(a0,r1,z1));f(P(a0,r1,z0),P(a1,r1,z0),P(a1,r1,z1),P(a0,r1,z1));
        f(P(a0,r0,z0),P(a0,r0,z1),P(a0,r1,z1),P(a0,r1,z0));f(P(a1,r0,z0),P(a1,r1,z0),P(a1,r1,z1),P(a1,r0,z1));f(P(a0,r0,z0),P(a1,r0,z0),P(a1,r0,z1),P(a0,r0,z1));}}}
  /* ---------- the wheel ---------- */
  const zf=hw*.86,RIM=[1,1,1],dish={bead:.012,ten:.03,split:.035,cap:.02,steel:.03,flat:.012,mag:.04}[w.style]||.05;
  const face=zf-dish,lipIn=rimR*.93;
  for(let i=0;i<seg;i++){const a=i/seg*TAU,b=(i+1)/seg*TAU,c=Math.cos,s=Math.sin;
    /* the outer lip, the inner barrel, and the dark back of the barrel */
    mb.quad([c(a)*rimR*1.04,s(a)*rimR*1.04,zf+.006],[c(b)*rimR*1.04,s(b)*rimR*1.04,zf+.006],[c(b)*lipIn,s(b)*lipIn,zf-.004],[c(a)*lipIn,s(a)*lipIn,zf-.004],RIM,0,w.style==='bead'?MAT.METAL:MAT.RIM);
    mb.quad([c(a)*lipIn,s(a)*lipIn,zf-.004],[c(b)*lipIn,s(b)*lipIn,zf-.004],[c(b)*lipIn,s(b)*lipIn,face-.14],[c(a)*lipIn,s(a)*lipIn,face-.14],[.4,.4,.42],0,MAT.METAL);}
  {const back=new Array(seg).fill(0).map((_,i)=>[Math.cos(i/seg*TAU)*lipIn,Math.sin(i/seg*TAU)*lipIn,face-.13]);for(let i=0;i<seg;i++)mb.tri([0,0,face-.13],back[(i+1)%seg],back[i],[.01,.01,.012],0,MAT.COL);}
  /* the brake: rotor and caliper (painted with the big kits) */
  const bigB=w.brake!=='stock',rr=rimR*(bigB?.86:.78),cz=face-.06;
  tubeAB(mb,[0,0,cz-.016],[0,0,cz+.016],rr,24,V([1,1,1],MAT.ROTOR));
  tubeAB(mb,[0,0,cz-.03],[0,0,cz+.02],rimR*.36,14,V([.18,.18,.2],MAT.METAL));
  {const a0=PI*.12,a1=PI*(bigB?.62:.48),r0=rr*.72,r1=rr*1.04,z0=cz-.04,z1=cz+.035,n=6,CM=V([1,1,1],MAT.CALIPER);
    for(let k=0;k<n;k++){const p=a0+(a1-a0)*k/n,q=a0+(a1-a0)*(k+1)/n,C=Math.cos,S=Math.sin;
      mb.quad([C(p)*r1,S(p)*r1,z1],[C(q)*r1,S(q)*r1,z1],[C(q)*r0,S(q)*r0,z1],[C(p)*r0,S(p)*r0,z1],CM[0],0,CM[2]);
      mb.quad([C(p)*r1,S(p)*r1,z0],[C(q)*r1,S(q)*r1,z0],[C(q)*r1,S(q)*r1,z1],[C(p)*r1,S(p)*r1,z1],CM[0],0,CM[2]);}}
  /* spokes: a prism from the hub to the lip, with depth and a little concavity */
  const RM=w.style==='bead'?MAT.METAL:MAT.RIM,rO=lipIn*.985;
  const sp=(a,w0,w1,r0,r1,tw,dz,dp=.03)=>{const c=Math.cos(a),s=Math.sin(a),c2=Math.cos(a+tw),s2=Math.sin(a+tw),n0=[-s,c],n1=[-s2,c2];
    const A=[c*r0+n0[0]*w0,s*r0+n0[1]*w0],B2=[c*r0-n0[0]*w0,s*r0-n0[1]*w0],C=[c2*r1-n1[0]*w1,s2*r1-n1[1]*w1],Dd=[c2*r1+n1[0]*w1,s2*r1+n1[1]*w1],zh=face+dz,zr=face;
    mb.quad([A[0],A[1],zh],[Dd[0],Dd[1],zr],[C[0],C[1],zr],[B2[0],B2[1],zh],RIM,0,RM);
    mb.quad([A[0],A[1],zh],[Dd[0],Dd[1],zr],[Dd[0],Dd[1],zr-dp],[A[0],A[1],zh-dp],RIM,0,RM);
    mb.quad([B2[0],B2[1],zh],[C[0],C[1],zr],[C[0],C[1],zr-dp],[B2[0],B2[1],zh-dp],RIM,0,RM);};
  const disc=(r0,r1,z,m,n=seg)=>{for(let i=0;i<n;i++){const a=i/n*TAU,b=(i+1)/n*TAU,C=Math.cos,S=Math.sin;mb.quad([C(a)*r1,S(a)*r1,z],[C(b)*r1,S(b)*r1,z],[C(b)*r0,S(b)*r0,z],[C(a)*r0,S(a)*r0,z],m[0],m[1],m[2]);}};
  let lugs=6,lugR=.072,hubR=.085;
  if(w.style==='six'){for(let i=0;i<6;i++){const a=i/6*TAU+PI/6;sp(a,.045,.07,.07,rO,0,.045,.035);}
    /* a turned ring where the spokes meet the lip */
    disc(rO*.93,rO,face+.004,V(RIM,RM));}
  else if(w.style==='ten'){for(let i=0;i<10;i++)sp(i/10*TAU,.017,.022,.06,rO,.06,.028,.03);lugs=5;}
  else if(w.style==='bead'){
    /* a flat face with eight round windows, a black bolt ring and its bolts */
    disc(.06,rO*.9,face+.01,V(RIM,MAT.RIM),seg);
    for(let i=0;i<8;i++){const a=i/8*TAU+PI/8,c=[Math.cos(a)*rO*.6,Math.sin(a)*rO*.6];

/* a tap on a car in the garage puts it on the turntable */
