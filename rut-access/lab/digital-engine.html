<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Digital Engine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Saira+Condensed:wght@500;600;700&family=Saira:wght@400;500;600&display=swap">
<style>
/* Layout: a test house at night. The catalogue of engines on the left, the instrument cluster and
   the controls in the middle, the setup sheet on the right. One committed dark look: lit instruments
   in a dark shed, whether the thing on the stand is a superbike, a locomotive or a chainsaw. */
:root{
  --bg:#0a0b0f;--surface:#111319;--raised:#181b23;--well:#07080b;
  --line:rgba(214,220,255,.09);--line-2:rgba(214,220,255,.17);
  --ink:#ecebf3;--ink-2:#a09fb3;--ink-3:#6b6a80;
  --accent:#ff3d5a;--amber:#ffb43c;--bank-a:#3fd8ff;--bank-b:#ff5ab4;--go:#5dff7a;--blue:#4c86ff;
  --f-display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --f-num:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Saira",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font:400 14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bank-a);outline-offset:2px}
.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;max-width:1680px;margin:0 auto}

/* ---------- top bar ---------- */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.mark{font:700 18px/1 var(--f-display);letter-spacing:.26em;color:var(--accent);white-space:nowrap}
.sub{font:600 12px/1 var(--f-display);letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.power{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--raised);cursor:pointer;font:600 12px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.power .dot{width:10px;height:10px;border-radius:50%;background:var(--ink-3);box-shadow:0 0 0 2px rgba(0,0,0,.4) inset}
.power[aria-pressed="true"] .dot{background:var(--go);box-shadow:0 0 10px var(--go)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;background:var(--surface);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{border:0;background:none;height:28px;padding:0 11px;border-radius:999px;cursor:pointer;font:500 12px/1 var(--f-body);color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 0 0 1px var(--line-2) inset}
.vol{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.vol input{width:96px}
input[type=range]{accent-color:var(--amber)}

/* ---------- three columns ---------- */
.lab{display:grid;grid-template-columns:262px minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1240px){.lab{grid-template-columns:minmax(0,1fr) 300px}.catalog{grid-column:1/-1}}
@media (max-width:860px){.lab{grid-template-columns:minmax(0,1fr)}}
h2{font:600 11px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);margin:0}

/* ---------- engine catalogue ---------- */
.catalog{display:flex;flex-direction:column;gap:10px;min-width:0}
.cathead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cathead span{font:500 12px/1 var(--f-num);color:var(--ink-3);letter-spacing:.04em}
.cattabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.cattabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-2)}
.cattabs button b{font:600 10.5px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.cattabs button small{font:500 11px/1 var(--f-num);color:var(--ink-3)}
.cattabs button[aria-selected="true"]{background:var(--raised);border-color:var(--line-2);color:var(--ink)}
.cattabs button[aria-selected="true"] small{color:var(--amber)}
.presets{display:flex;flex-direction:column;gap:4px}
@media (min-width:1241px){.presets{max-height:calc(100vh - 170px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;padding-right:2px}}
@media (max-width:1240px){.cattabs{max-width:560px}.presets{flex-direction:row;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}.preset{flex:0 0 220px;scroll-snap-align:start}}
.preset{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:9px 10px 9px 12px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;position:relative}
.preset:hover{background:var(--surface)}
.preset[aria-pressed="true"]{background:var(--raised);border-color:var(--line-2)}
.preset[aria-pressed="true"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--accent)}
.preset b{font:600 14px/1.2 var(--f-body)}
.preset small{grid-column:1;color:var(--ink-2);font-size:12px;line-height:1.3}
.preset .hp{grid-row:1/3;grid-column:2;align-self:center;font:600 15px/1 var(--f-num);color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}
.preset .hp em{display:block;font:500 10px/1.3 var(--f-body);font-style:normal;color:var(--ink-3);letter-spacing:.06em}

/* ---------- the cluster ---------- */
.cluster{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 236px;gap:4px 18px;padding:14px 18px 16px;border-radius:14px;
  background:radial-gradient(ellipse 70% 90% at 32% 45%,#171a24 0%,var(--well) 70%);border:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px rgba(0,0,0,.35)}
@media (max-width:620px){.cluster{grid-template-columns:minmax(0,1fr)}}
.machinehead{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding-bottom:6px}
.machinehead b{font:700 17px/1.1 var(--f-display);letter-spacing:.04em}
.machinehead span{color:var(--ink-2);font-size:13px}
#tach{width:100%;aspect-ratio:1.18;max-width:100%;display:block}
.read{display:flex;flex-direction:column;gap:12px;padding-top:8px;min-width:0}
.lbl{display:block;font:600 10px/1 var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gearrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:end}
.big{display:block;font:700 76px/.85 var(--f-num);color:var(--amber);text-shadow:0 0 22px rgba(255,180,60,.35);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:1ch}
.big.mid{font-size:44px;line-height:.95}.big.small{font-size:30px;line-height:1.1}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}
.pair>div{min-width:0}
.num{font:600 30px/1 var(--f-num);font-variant-numeric:tabular-nums}
.unit{font:500 11px/1 var(--f-body);color:var(--ink-2);margin-left:4px}
.meter .track{height:6px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden}
.meter .track i{display:block;height:100%;width:0;border-radius:4px;background:var(--amber);transition:width .06s linear}
.meter .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter .row span:last-child{font:600 13px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
#m3Fill{background:var(--bank-a)}#m2Fill{background:var(--go)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips span{font:600 10px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;padding:5px 7px;border-radius:5px;border:1px solid var(--line);color:var(--ink-3)}
.chips span.on{color:#0a0b0f;border-color:transparent}
.chips span.on[data-tone=red]{background:var(--accent)}
.chips span.on[data-tone=amber]{background:var(--amber)}
.chips span.on[data-tone=green]{background:var(--go)}
.chips span.on[data-tone=cyan]{background:var(--bank-a)}
.cover{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:24px;border-radius:14px;background:rgba(7,8,11,.78);backdrop-filter:blur(3px)}
.cover button{height:52px;padding:0 26px;border-radius:999px;border:1px solid rgba(255,61,90,.7);background:radial-gradient(circle at 50% 30%,rgba(255,61,90,.4),#1a0d12 75%);cursor:pointer;
  font:700 15px/1 var(--f-display);letter-spacing:.18em;text-transform:uppercase;box-shadow:0 0 30px rgba(255,61,90,.25)}
.cover p{margin:0;max-width:40ch;color:var(--ink-2);font-size:13px}

/* ---------- hands and feet ---------- */
.controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;margin-top:12px;align-items:stretch}
@media (max-width:620px){.controls{grid-template-columns:minmax(0,1fr)}}
.pad{position:relative;overflow:hidden;min-height:104px;border-radius:var(--r);border:1px solid rgba(93,255,122,.35);background:var(--surface);cursor:ns-resize;touch-action:none;user-select:none;-webkit-user-select:none;
  display:flex;flex-direction:column;justify-content:center;padding:10px 16px}
.pad.latch{border-color:rgba(255,180,60,.4)}
.pad span{font:700 13px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase;position:relative;z-index:1}
.pad small{color:var(--ink-2);font-size:12px;margin-top:5px;position:relative;z-index:1;max-width:30ch}
.pad output{position:relative;z-index:1;font:700 26px/1 var(--f-num);color:var(--amber);margin-top:6px;font-variant-numeric:tabular-nums}
.pad i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,rgba(93,255,122,.35),rgba(93,255,122,.08))}
.pad.latch i{background:linear-gradient(to top,rgba(255,180,60,.32),rgba(255,180,60,.07));border-top:2px solid var(--amber)}
.ticks{position:absolute;inset:0;pointer-events:none}
.ticks b{position:absolute;right:0;width:14px;height:1px;background:var(--line-2)}
.btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-content:start}
.btns button{min-height:46px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font:600 11px/1.15 var(--f-display);letter-spacing:.08em;text-transform:uppercase;touch-action:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 4px}
.btns button kbd{font-size:10px;padding:1px 4px;color:var(--ink-3)}
.btns button.on,.btns button[aria-pressed="true"]{background:var(--raised);border-color:var(--amber);color:var(--amber)}
.btns button:disabled{opacity:.35;cursor:default}
.btns button[data-tone=red]{border-color:rgba(255,61,90,.45)}.btns button[data-tone=cyan]{border-color:rgba(63,216,255,.45)}
.keys{grid-column:1/-1;margin:0;color:var(--ink-2);font-size:12px}
kbd{font:600 11px/1 var(--f-num);padding:2px 5px;border-radius:4px;border:1px solid var(--line-2);background:var(--raised);color:var(--ink)}

/* ---------- analysis panels ---------- */
.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:620px){.panels{grid-template-columns:minmax(0,1fr)}}
.panel{margin:0;padding:12px 14px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);min-width:0}
.panel figcaption{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:8px}
.panel figcaption b{font:600 11px/1 var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.panel figcaption span{font:500 12px/1.2 var(--f-num);color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.panel canvas{display:block;width:100%;aspect-ratio:1.9;max-width:100%}
.note{margin:8px 0 0;color:var(--ink-2);font-size:12.5px;max-width:62ch}
.note b{font-weight:600;color:var(--ink)}
.legend{display:inline-flex;gap:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* ---------- setup sheet ---------- */
.setup{display:flex;flex-direction:column;gap:12px}
.sheet{border-radius:var(--r);background:var(--surface);border:1px solid var(--line);padding:12px 14px 10px}
.sheet h3{font:600 11px/1 var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin:0 0 8px}
.row{display:grid;grid-template-columns:minmax(0,1fr);gap:5px;padding:7px 0;border-top:1px solid var(--line)}
.sheet h3+.row{border-top:0;padding-top:2px}
.row .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.row .head output{font:600 13px/1 var(--f-num);color:var(--ink);font-variant-numeric:tabular-nums}
.row select{width:100%;height:32px;border-radius:7px;border:1px solid var(--line-2);background:var(--raised);padding:0 8px}
.row .seg{display:flex;width:100%}
.row .seg button{flex:1;padding:0 4px;font-size:12px}
.row input[type=range]{width:100%}
.row.tog{grid-template-columns:1fr auto;align-items:center}
.row .why{font-size:11.5px;color:var(--ink-3);margin:-2px 0 0}
.switch{position:relative;width:38px;height:22px;border-radius:999px;border:1px solid var(--line-2);background:var(--raised);cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--ink-3);transition:transform .12s,background .12s}
.switch[aria-checked="true"]{background:rgba(93,255,122,.18);border-color:rgba(93,255,122,.5)}
.switch[aria-checked="true"]::after{transform:translateX(16px);background:var(--go)}
.sheet.empty .row{display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1;min-height:36px;border-radius:8px;border:1px solid var(--line-2);background:var(--raised);cursor:pointer;font:600 11px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.status{font-size:12px;color:var(--ink-3);margin:0}
@media (prefers-reduced-motion:reduce){.meter .track i,.switch::after{transition:none}}
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><span class="mark">DIGITAL ENGINE</span><span class="sub">Sound lab</span></div>
    <button id="power" class="power" type="button" aria-pressed="false"><span class="dot"></span><span id="powerLbl">Start engine</span></button>
    <div class="seg" role="group" aria-label="Mode" id="segMode"></div>
    <div class="seg" role="group" aria-label="Listen from" id="segListen"></div>
    <div class="seg" role="group" aria-label="Surroundings" id="segRoom"><button type="button" data-v="open" aria-pressed="true">Open air</button><button type="button" data-v="garage" aria-pressed="false">Indoors</button><button type="button" data-v="tunnel" aria-pressed="false">Tunnel</button></div>
    <label class="vol" for="vol">Volume <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
  </header>

  <main class="lab">
    <aside class="catalog" aria-label="Engines">
      <div class="cathead"><h2>Engines</h2><span id="catCount"></span></div>
      <div class="cattabs" role="tablist" aria-label="Kind of engine" id="catTabs"></div>
      <div id="presets" class="presets"></div>
    </aside>

    <section class="stage" aria-label="Instruments">
      <div class="cluster">
        <div class="machinehead"><b id="mName"></b><span id="mTag"></span></div>
        <canvas id="tach" aria-label="Tachometer and shift lights"></canvas>
        <div class="read">
          <div class="gearrow">
            <div><span class="lbl" id="lGear">Gear</span><span id="gear" class="big">N</span></div>
            <div class="pair">
              <div><span class="lbl" id="lSpeed">Speed</span><span id="speed" class="num">0</span><span class="unit" id="uSpeed">km/h</span></div>
              <div><span class="lbl" id="lPwr">Power</span><span id="pwr" class="num">0</span><span class="unit" id="uPwr">hp</span></div>
            </div>
          </div>
          <div class="meter"><div class="row"><span class="lbl" id="lM1">Throttle</span><span id="m1Txt">0%</span></div><div class="track"><i id="m1Fill"></i></div></div>
          <div class="meter" id="m2"><div class="row"><span class="lbl" id="lM2">Boost</span><span id="m2Txt">0.00 bar</span></div><div class="track"><i id="m2Fill"></i></div></div>
          <div class="meter" id="m3"><div class="row"><span class="lbl" id="lM3">Nitrous</span><span id="m3Txt">None</span></div><div class="track"><i id="m3Fill"></i></div></div>
          <div class="chips" id="chips"></div>
        </div>
        <div id="cover" class="cover"><button id="startBig" type="button">Start the engine</button><p>Sound starts when you click. Headphones or good speakers help: the ship and the locomotive go down to 20 Hz.</p></div>
      </div>

      <div class="controls">
        <div class="pad" id="pad" role="slider" aria-label="Throttle" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <div class="ticks" id="ticks"></div><span id="padLbl">Throttle</span><small id="padHint">Press and hold. Higher up means more throttle.</small><output id="padVal" hidden></output><i id="padFill"></i></div>
        <div class="btns" id="btns"></div>
        <p class="keys" id="keys"></p>
      </div>

      <div class="panels">
        <figure class="panel"><figcaption><b id="crankTitle">Firing order</b><span id="crankName"></span></figcaption><canvas id="crank" aria-label="Firing order diagram"></canvas><p id="crankNote" class="note"></p></figure>
        <figure class="panel"><figcaption><b id="curveTitle">Torque and power</b><span id="curvePeak"></span></figcaption><canvas id="curve" aria-label="Torque and power curves, or the governor trace"></canvas><p id="curveNote" class="note"></p></figure>
        <figure class="panel"><figcaption><b>Pressure at your ear</b><span id="scopeNote">one engine cycle</span></figcaption><canvas id="scope" aria-label="Waveform"></canvas></figure>
        <figure class="panel"><figcaption><b>Spectrogram</b><span id="specNote"></span></figcaption><canvas id="spec" aria-label="Scrolling spectrogram"></canvas><p class="note">The last eight seconds of sound, 20 Hz to 10 kHz. The dashed cyan trace marks the firing note.</p></figure>
      </div>
    </section>

    <aside class="setup" id="setup" aria-label="Setup sheet"></aside>
  </main>
</div>
<script>
/* ---- src/audio/engine-dsp.js ---- */
/* =====================================================================================
   DIGITAL ENGINE SYNTH — live, sample by sample.
   Every cylinder fires on its own crank angle, in its real firing order, into its own bank
   of pipe. The pipes are 1-D acoustic waveguides (Kelly-Lochbaum scattering at every change
   of bore, lossy where there is packing, a closed-ish valve at one end and an open radiating
   tip at the other), run live rather than baked into an impulse response. On top: flow rasp
   gated by each pulse, induction through its own airbox model, afterfire and bangs fired
   into the pipes, turbo/supercharger/gear whine, blow-off, nitrous, the starter, and a
   listener with real propagation delay (so Doppler falls out of a moving source).

   Heavy and old machinery adds: diesel combustion knock, the compression-release (jake)
   brake, two-stroke firing, steam chuffs through a blast pipe and chimney, drain cocks and
   safety valves, horns, whistles and bells, air brakes, hydraulic pumps and relief valves,
   track plates, rail joints, alternator hum, fans, chains, blades and propellers.

   makeDSP() returns the EngineDSP class. Its source is stringified into an AudioWorklet
   module, so everything it needs is declared inside this function.
   ===================================================================================== */
function makeDSP(){
'use strict';
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const C_GAS=500;   /* speed of sound in hot exhaust gas, m/s */
const C_AIR=343;   /* and in the air between the machine and you */
const ftanh=x=>{if(x>3)return 1;if(x<-3)return -1;const x2=x*x;return x*(27+x2)/(27+9*x2);};
const LP=0,HP=1,BP=2;

class Biquad{
  constructor(){this.b0=1;this.b1=0;this.b2=0;this.a1=0;this.a2=0;this.z1=0;this.z2=0;}
  set(type,f,q,sr){
    const w=TAU*clamp(f,8,sr*.47)/sr,cw=Math.cos(w),al=Math.sin(w)/(2*q),a0=1+al;let b0,b1,b2;
    if(type===LP){b0=(1-cw)/2;b1=1-cw;b2=b0;}else if(type===HP){b0=(1+cw)/2;b1=-(1+cw);b2=b0;}else{b0=al;b1=0;b2=-al;}
    this.b0=b0/a0;this.b1=b1/a0;this.b2=b2/a0;this.a1=-2*cw/a0;this.a2=(1-al)/a0;return this;
  }

const ROWS=[];
function setVal(r,v){
  if(r.sim){sim[r.k]=!!v;syncSetup();return;}
  const o={};o[r.k]=v;
  /* bigger engines make more torque: keep the preset's torque per litre */
  if(r.k==='disp'&&st.preset.disp)o.tq=st.preset.tq/st.preset.disp*v;
  if(r.k==='redline'){const lr=cur().launchRpm;if(lr>v*.9)o.launchRpm=Math.round(v*.65/100)*100;if(spec.idle>v*.6)o.idle=Math.round(v*.3);}
  Object.assign(st.over,o);applySpec();
}
function buildSetup(){

    const s=document.createElement('section');s.className='sheet';const h=document.createElement('h3');h.textContent=sec.h;s.appendChild(h);sec.el=s;
    for(const r of sec.rows){
      const row=document.createElement('div');row.className='row'+(r.t==='toggle'?' tog':'');const id=r.id||('set-'+r.k);
      const head=document.createElement('div');head.className='head';const lab=document.createElement('label');lab.htmlFor=id;head.appendChild(lab);row.appendChild(head);r.lab=lab;
      let el;

        el.addEventListener('change',()=>{const raw=el.value;setVal(r,/^\d+$/.test(raw)?+raw:raw);});row.appendChild(el);}
      else if(r.t==='seg'){el=document.createElement('div');el.className='seg';el.id=id;el.setAttribute('role','group');
        for(const [v,n] of r.opts()){const b=document.createElement('button');b.type='button';b.dataset.v=String(v);b.textContent=n;b.addEventListener('click',()=>setVal(r,v));el.appendChild(b);}

      else{el=document.createElement('button');el.type='button';el.className='switch';el.id=id;el.setAttribute('role','switch');
        el.addEventListener('click',()=>setVal(r,el.getAttribute('aria-checked')!=='true'?1:0));row.appendChild(el);}

    <p class="status" id="status" style="margin-top:8px">Audio starts when you start the engine.</p>`;
  box.appendChild(act);
  $('bReset').addEventListener('click',()=>{st.over={};applySpec();});
  $('bCopy').addEventListener('click',()=>{
    const o=cur(),skip=new Set(['id','grp','tag','gears','gearV','orders','axles','imp','ch']);

/* ---------- per-machine controls ---------- */
function padCfg(){
  const M=S.MACHINES[spec.machine]||{},lv=M.lever;
  if(lv)return {latch:1,label:lv.label,steps:lv.steps||0,names:lv.names||null};
  return {latch:0,label:ui().spring||'Throttle'};
}
function leverText(v){
  const P=padCfg(),m=spec.machine;
  if(P.steps)return P.names[Math.round(v*P.steps)];
  if(m==='genset')return Math.round(v*100)+'% load';
  if(m==='hitmiss')return fmt(lerp(spec.govMin,spec.govMax,v))+' rpm';
  if(m==='mower')return v<.12?'Slow':v>.88?'Fast':Math.round(v*100)+'%';
  return Math.round(v*100)+'%';
}
let CTLS=[];

  $('padVal').hidden=!P.latch;
  const tk=$('ticks');tk.textContent='';if(P.steps)for(let i=1;i<P.steps;i++){const b=document.createElement('b');b.style.bottom=`calc(6px + ${i/P.steps} * (100% - 12px))`;tk.appendChild(b);}

  CTLS=(CTL[spec.machine]||CTL.car).filter(d=>!d.need||d.need(spec));

    const b=document.createElement('button');b.type='button';b.dataset.id=d.id;if(d.tone)b.dataset.tone=d.tone;
    b.innerHTML=`<span></span><kbd>${esc(d.k.replace('Key',''))}</kbd>`;b.querySelector('span').textContent=d.l;d.el=b;
    if(d.t==='hold'){
      const set=v=>{if(b.disabled)return;ctlHold(d,v);};

      for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>set(false));
      b.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();set(true);}});b.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')set(false);});
    }else b.addEventListener('click',()=>ctlPress(d));
    box.appendChild(b);
  }
  const keyTxt=P.latch?(P.steps?'<kbd>W</kbd> <kbd>S</kbd> or <kbd>0</kbd>–<kbd>'+Math.min(9,P.steps)+'</kbd> '+esc(P.label.toLowerCase()):'<kbd>W</kbd> <kbd>S</kbd> or <kbd>0</kbd>–<kbd>9</kbd> '+esc(P.label.toLowerCase()))
    :'<kbd>Space</kbd> '+(P.label==='Trigger'?'trigger':'throttle')+' · <kbd>1</kbd>–<kbd>9</kbd> part '+(P.label==='Trigger'?'trigger':'throttle');
  $('keys').innerHTML=keyTxt+' · '+CTLS.map(d=>`<kbd>${esc(d.k.replace('Key',''))}</kbd> ${esc(d.l.toLowerCase())}`).join(' · ')+' · <kbd>I</kbd> ignition · <kbd>V</kbd> where you listen';

  const sl=$('segListen');sl.textContent='';ui().listen.forEach((n,i)=>{const b=document.createElement('button');b.type='button';b.dataset.v=String(i);b.textContent=n;b.setAttribute('aria-pressed',String(st.listener===i));sl.appendChild(b);});
  const ch=$('chips');ch.textContent='';for(const [k,n,tone] of CHIPS[spec.machine]||CHIPS.car){const s=document.createElement('span');s.dataset.c=k;s.dataset.tone=tone;s.textContent=n;ch.appendChild(s);}
  syncPower();syncButtons(true);
  $('startBig').textContent=spec.machine==='steam'?'Raise steam':'Start the engine';
}
function ctlHold(d,v){
  d.el&&d.el.classList.toggle('on',v);
  if(d.id==='brake'&&spec.road)st.brkBtn=v;
  else if(d.id==='nos')st.nos=v;
  else sim.ctl(d.id,v?1:0);
}
function leverStep(n,f){
  const P=padCfg();
  if(P.steps&&!f)sim.lever=clamp(Math.round(sim.lever*P.steps)+n,0,P.steps)/P.steps;
  else sim.lever=clamp(Math.round((sim.lever+(f||n*.1))*100)/100,0,1);
}
const ACT={up:()=>sim.shift(1),down:()=>sim.shift(-1),purge:()=>{if(audio)audio.port.post({t:'ev',ev:{type:'purge'}});},blip:()=>{st.blipT=.22;},trip:()=>sim.trip()};
function ctlPress(d){

  x.fillStyle=rgba(COL.accent,.08);x.fillRect(X(e.redline),t,rr-X(e.redline),b-t);
  const line=(f,col)=>{x.strokeStyle=col;x.lineWidth=2.2*u;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(X(p.rpm),f(p)):x.moveTo(X(p.rpm),f(p)));x.stroke();};
  line(p=>Yt(p.tq),COL.amber);line(p=>Yp(p.hp),COL.accent);
  const rpm=sim.st==='off'?0:sim.rpm;if(rpm>0){const q=pts.reduce((a,p)=>Math.abs(p.rpm-rpm)<Math.abs(a.rpm-rpm)?p:a,pts[0]);
    x.strokeStyle=rgba(COL.ink,.5);x.lineWidth=1*u;x.beginPath();x.moveTo(X(rpm),t);x.lineTo(X(rpm),b);x.stroke();
    for(const [y,col] of [[Yt(q.tq),COL.amber],[Yp(q.hp),COL.accent]]){x.fillStyle=col;x.beginPath();x.arc(X(rpm),y,3.5*u,0,TAU);x.fill();}}
}
/* the governor trace: engine speed and fuel over the last 20 seconds */
function histVals(){
  if(spec.machine==='steam')return [clamp(sim.v*3.6/140,0,1),clamp((sim.pB-10)/(spec.boiler+1-10),0,1)];
  const {M}=tachScale(spec);return [clamp((sim.st==='off'?0:sim.rpm)/M,0,1),clamp(sim.st==='off'?0:sim.rack||0,0,1)];
}
function drawStrip(o){
  const x=o.x,w=o.w,h=o.h,u=o.u,H=st.hist;x.clearRect(0,0,w,h);
  const l=8*u,rr=w-44*u,t=10*u,b=h-20*u,N=400;
  x.strokeStyle=COL.line;x.lineWidth=1*u;for(let k=0;k<=4;k++){const y=b-(b-t)*k/4;x.beginPath();x.moveTo(l,y);x.lineTo(rr,y);x.stroke();}
  x.fillStyle=COL['ink-3'];x.font=`500 ${Math.round(10*u)}px ${FNUM}`;x.textBaseline='top';
  for(const [s,lbl] of [[20,'−20 s'],[10,'−10 s'],[0,'now']]){const px=rr-(rr-l)*s/20;x.textAlign=s===20?'left':s===0?'right':'center';x.fillText(lbl,px,b+5*u);}
  const X=i=>rr-(rr-l)*(H.length-1-i)/(N-1),Y=v=>b-(b-t)*v;
  const line=(k,col,fill)=>{if(H.length<2)return;x.beginPath();H.forEach((p,i)=>i?x.lineTo(X(i),Y(p[k])):x.moveTo(X(i),Y(p[k])));
    if(fill){x.save();x.lineTo(X(H.length-1),b);x.lineTo(X(0),b);x.closePath();x.fillStyle=rgba(col,.1);x.fill();x.restore();x.beginPath();H.forEach((p,i)=>i?x.lineTo(X(i),Y(p[k])):x.moveTo(X(i),Y(p[k])));}
    x.strokeStyle=col;x.lineWidth=2*u;x.stroke();};
  line(1,COL.accent,true);line(0,COL.amber,false);
  if(H.length){const p=H[H.length-1];x.textAlign='left';x.textBaseline='middle';
    const steam=spec.machine==='steam';
    x.fillStyle=COL.amber;x.fillText(steam?fmt(sim.v*3.6)+' km/h':fmt(sim.rpm)+' rpm',rr+5*u,Y(p[0]));
    x.fillStyle=COL.accent;x.fillText(steam?(sim.pB||0).toFixed(1)+' bar':Math.round(p[1]*100)+'%',rr+5*u,clamp(Y(p[1]),t+6*u,b-4*u)+(Math.abs(Y(p[1])-Y(p[0]))<12*u?12*u:0));
    x.beginPath();x.arc(X(H.length-1),Y(p[0]),3*u,0,TAU);x.fillStyle=COL.amber;x.fill();}
}

function drawScope(o){
  const x=o.x,w=o.w,h=o.h,u=o.u;x.clearRect(0,0,w,h);
  x.strokeStyle=COL.line;x.lineWidth=1*u;x.beginPath();x.moveTo(0,h/2);x.lineTo(w,h/2);x.stroke();
  if(!audio||sim.st==='off')return;
  const td=audio.td;audio.an.getFloatTimeDomainData(td);const sr=audio.ctx.sampleRate,N=td.length;
  /* show exactly one engine cycle (two crank turns, every cylinder once), triggered on its biggest pulse */
  const rpm=Math.max(spec.road?300:5,sim.rpmOut||0),cyc=Math.round(clamp(120/rpm*sr,256,N/2));
  let pk=0,pi=0;for(let i=1;i<N-cyc;i++){const v=td[i];if(v>pk){pk=v;pi=i;}}
  let st0=pi;while(st0>1&&!(td[st0-1]<0&&td[st0]>=0))st0--;
  let amp=1e-4;for(let i=0;i<cyc;i++)amp=Math.max(amp,Math.abs(td[st0+i]));st.scopeAmp=Math.max(amp,(st.scopeAmp||amp)*.94);
  x.strokeStyle=COL.go;x.lineWidth=1.6*u;glowOn(x,COL.go,6*u);x.beginPath();
  for(let i=0;i<cyc;i++){const px=i/(cyc-1)*w,py=h/2-td[st0+i]/st.scopeAmp*h*.42;i?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();glowOff(x);
  const full=cyc>=Math.round(120/rpm*sr)-1,t=full?`one engine cycle · ${(cyc/sr*1000).toFixed(0)} ms`:`the last ${(cyc/sr*1000).toFixed(0)} ms`;
  if(st.shown.scope!==t){st.shown.scope=t;$('scopeNote').textContent=t;}
}

/* spectrogram: log frequency, scrolling left, with the firing note traced over it */
const SPEC={lut:null,f0:20,f1:10000};
function specLut(){const a=new Uint8ClampedArray(256*4),hx=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
  const stops=[[0,hx(COL.well)],[.3,[30,20,60]],[.55,hx(COL['bank-b'])],[.78,hx(COL.amber)],[1,[255,246,230]]];
  for(let i=0;i<256;i++){const t=i/255;let k=0;while(k<stops.length-2&&t>stops[k+1][0])k++;const [t0,c0]=stops[k],[t1,c1]=stops[k+1],q=clamp((t-t0)/(t1-t0),0,1);for(let j=0;j<3;j++)a[i*4+j]=c0[j]+(c1[j]-c0[j])*q;a[i*4+3]=255;}SPEC.lut=a;}
function drawSpec(o){
  const x=o.x,w=o.w,h=o.h,u=o.u,lab=30*u,PW=w-lab,step=Math.max(1,Math.round(1.5*u));
  if(o.changed){o.changed=false;x.fillStyle=COL.well;x.fillRect(0,0,w,h);}
  const lf=Math.log(SPEC.f0),lr=Math.log(SPEC.f1)-lf,yOf=f=>h-(Math.log(f)-lf)/lr*h;
  x.drawImage(o.c,step,0,PW-step,h,0,0,PW-step,h);
  const col=x.createImageData(step,h),D=col.data,L=SPEC.lut;
  if(audio&&sim.st!=='off'){const fd=audio.fd;audio.an.getFloatFrequencyData(fd);const sr=audio.ctx.sampleRate,bins=fd.length;
    for(let y=0;y<h;y++){const f=Math.exp(lf+(1-y/h)*lr),bi=Math.min(bins-1,Math.round(f/(sr/2)*bins));let v=fd[bi];if(bi>1&&bi<bins-1)v=Math.max(v,fd[bi-1],fd[bi+1]);
      const q=clamp(Math.round((v+92)/68*255),0,255);for(let k=0;k<step;k++){const p=(y*step+k)*4;D[p]=L[q*4];D[p+1]=L[q*4+1];D[p+2]=L[q*4+2];D[p+3]=255;}}}
  else{const c=[parseInt(COL.well.slice(1,3),16),parseInt(COL.well.slice(3,5),16),parseInt(COL.well.slice(5,7),16)];for(let i=0;i<D.length;i+=4){D[i]=c[0];D[i+1]=c[1];D[i+2]=c[2];D[i+3]=255;}}
  x.putImageData(col,PW-step,0);
  const L2=S.LAYOUTS[spec.layout],rpm=sim.st==='off'?0:Math.max(0,sim.rpmOut||0),ff=rpm/60*L2.fire.length/2;
  if(ff>=SPEC.f0&&ff<=SPEC.f1&&((performance.now()/120|0)%2)){x.fillStyle=COL['bank-a'];x.fillRect(PW-step,yOf(ff)-u,step,2*u);}
  x.fillStyle=COL.well;x.fillRect(PW,0,lab,h);x.fillStyle=COL['ink-3'];x.font=`500 ${Math.round(10*u)}px ${FNUM}`;x.textAlign='left';x.textBaseline='middle';
  for(const [f,t] of [[30,'30'],[100,'100'],[300,'300'],[1000,'1k'],[3000,'3k'],[10000,'10k']]){const y=clamp(yOf(f),6*u,h-6*u);x.fillRect(PW,yOf(f),4*u,1);x.fillText(t,PW+6*u,y);}
  const t=ff>1?`firing note ${ff<100?ff.toFixed(1):fmt(ff)} Hz`:'';if(st.shown.spec!==t){st.shown.spec=t;$('specNote').textContent=t;}
}

/* ---------- readouts ---------- */
const RO={};
function setText(id,v){if(RO[id]!==v){RO[id]=v;$(id).textContent=v;}}
function setBig(v){v=String(v);if(RO.gear!==v){RO.gear=v;const el=$('gear');el.textContent=v;el.classList.toggle('mid',v.length>2&&v.length<=4);el.classList.toggle('small',v.length>4);}}
function meter(i,show,lbl,txt,f){const m=$('m'+i);if(i>1){if(m.hidden===show)m.hidden=!show;if(!show)return;}setText('lM'+i,lbl);setText('m'+i+'Txt',txt);$('m'+i+'Fill').style.width=(clamp(f,0,1)*100).toFixed(1)+'%';}
const ORDERS=['STOP','D.SLOW','SLOW','HALF','FULL'];
function readouts(){
  const e=spec,on=sim.st!=='off',M=e.machine,running=sim.running;
  const hpNow=()=>on&&running?Math.max(0,sim.pwr||0)/745.7:0;
  let g,gl,sp,sl,su,pw,pl,pu;
  if(e.road){
    gl='Gear';g=sim.mode!=='drive'?'N':sim.shiftT>0?'–':sim.gear?String(sim.gear):'N';sl='Speed';sp=fmt(sim.v*3.6);su='km/h';pl='Power';pu='hp';
    pw=fmt(on&&running?Math.max(0,S.engTq(e,sim.rpm,sim.thr,sim.boost))*sim.rpm*TAU/60/745.7+(sim.nosOn?e.nosKw*1.341:0):0);
    meter(1,1,'Throttle',Math.round(sim.thr*100)+'%',sim.thr);
    meter(2,!!e.fiBoost,'Boost',(sim.boost||0).toFixed(2)+' bar',(sim.boost||0)/(e.fiBoost*1.05||1));
    if(e.nosKw)meter(3,1,'Nitrous',S.NOS_SHOTS[e.nos|0]+' shot',sim.nos);else if(e.jake)meter(3,1,'Jake brake',['Off','Low','Medium','High'][sim.c.jake|0],(sim.c.jake|0)/3);else meter(3,0);
  }else{
    const rack=sim.rack||0;
    meter(1,1,M==='steam'?'Regulator':'Fuel rack',Math.round((M==='steam'?sim.thr:rack)*100)+'%',M==='steam'?sim.thr:rack);
    meter(2,!!e.fiBoost||M==='steam',M==='steam'?'Boiler pressure':M==='ship'?'Scavenge air':'Boost',M==='steam'?(sim.pB||0).toFixed(1)+' bar':(sim.boost||0).toFixed(2)+' bar',M==='steam'?(sim.pB-8)/(e.boiler+.5-8):(sim.boost||0)/(e.fiBoost*1.05||1));
    let m3=null;
    pl='Power';pu='hp';pw=fmt(hpNow());sl='Speed';su='km/h';sp=fmt(Math.abs(sim.v||0)*3.6);
    if(M==='loco'){gl='Notch';g=sim.dynOn?'DB':String(sim.notch|0);pl='Traction';pw=fmt(Math.max(0,sim.trac||0)/.7457);if(sim.mode!=='free')m3=["Load regulator",Math.round((sim.lr||0)*100)+'%',sim.lr||0];}
    else if(M==='steam'){gl='Cut-off';g=Math.round((sim.c.cutoff||0)*100)+'%';pl='Drawbar';pw=fmt(hpNow());m3=['Brake air',Math.round((sim.resv||0)*100)+'%',sim.resv||0];}
    else if(M==='ship'){gl='Telegraph';g=ORDERS[sim.order|0]||'STOP';sp=((sim.v||0)*1.944).toFixed(1);su='knots';pw=fmt(Math.max(0,sim.pwr||0)/745.7);}
    else if(M==='genset'){gl='Load';g=Math.round(sim.lever*100)+'%';sl='Frequency';sp=(sim.st==='off'?0:sim.rpm/30).toFixed(1);su='Hz';pl='Output';pw=fmt(sim.kWout||0);pu='kW';}
    else if(M==='hitmiss'){gl='Stroke';g=sim.stroke||'–';sl='Set speed';sp=fmt(sim.setRpm||0);su='rpm';const h=sim.hits||[],hits=h.reduce((a,b)=>a+b,0);pl='Fires';pw=hits?'1 in '+Math.max(1,Math.round(h.length/hits)):'–';pu='';}
    else if(M==='tractor'){gl='Gear';g=sim.mode==='drive'?String(sim.c.gearM|0):'N';}
    else if(M==='excavator'){gl='Dial';g=String(sim.dial||Math.round(sim.lever*9)+1);sl='Pump';sp=fmt((sim.press||0)*350);su='bar';}
    else if(M==='saw'){gl='Chain';g=sim.chip.clutch?'ON':'–';sl='Chain speed';sp=fmt(sim.chainV||0);su='m/s';pw=(hpNow()).toFixed(1);}
    else if(M==='mower'){gl='Mowing';g=sim.c.mow?'ON':'OFF';sl='Blade tip';sp=fmt(sim.rpm/60*Math.PI*.48);su='m/s';pw=(hpNow()).toFixed(1);}
    if(m3)meter(3,1,m3[0],m3[1],m3[2]);else meter(3,0);
  }
  setText('lGear',gl);setBig(g);setText('lSpeed',sl);setText('speed',sp);setText('uSpeed',su);setText('lPwr',pl);setText('pwr',pw);setText('uPwr',pu);
  const P=padCfg(),pv=P.latch?sim.lever:readInput(0).thr;$('padFill').style.height=(pv*100).toFixed(1)+'%';$('pad').setAttribute('aria-valuenow',String(Math.round(pv*100)));
  if(P.latch)setText('padVal',leverText(sim.lever));
  /* chips */
  const ch=sim.chip||{},bang=performance.now()-st.popT<140;
  const C=e.road?{lim:sim.cutFrac>.5&&!sim.twostep&&!sim.tcOn&&sim.shiftT<=0||e.diesel&&sim.rpm>e.limiterRpm-60,step:sim.twostep,tc:sim.tcOn,al:!!(e.antilag&&e.turbo&&sim.thr<.2&&running&&sim.rpm>e.redline*.3),
    nos:sim.nosOn,bang,jake:!!sim.jakeOut,air:sim.brkT>0||sim.dryerT>0,horn:sim.hornOn}:Object.assign({bang},ch);
  for(const s of $('chips').children){const v=!!C[s.dataset.c];if(s.classList.contains('on')!==v)s.classList.toggle('on',v);}
}

/* ---------- the loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,Math.max(.001,(now-last)/1000));last=now;
  const inp=readInput(dt);for(let k=0;k<4;k++)sim.step(dt/4,inp);
  const ev=sim.takeEvents();
  if(audio){for(const e of ev)audio.port.post({t:'ev',ev:e});audio.port.post({t:'p',p:sim.params(st.listener,1)});}
  if(sim.st==='off'&&$('power').getAttribute('aria-pressed')==='true')syncPower();
  if(sim.stalled){sim.stalled=false;syncPower();$('status').textContent='It stalled. Start it again with the button or I.';}
  if(!spec.road){st.histT+=dt;while(st.histT>=.05){st.histT-=.05;st.hist.push(histVals());if(st.hist.length>400)st.hist.shift();}}
  try{drawTach(CV.tach);drawCrank(CV.crank,dt);if(spec.road)drawCurve(CV.curve);else drawStrip(CV.curve);drawScope(CV.scope);drawSpec(CV.spec);readouts();syncButtons();}catch(err){console.error(err);}
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
buildTabs();buildPresets();buildSetup();bindControls();specLut();applySpec();fit();
if(window.ResizeObserver){const ro=new ResizeObserver(()=>fit());for(const id of ['tach','crank','curve','scope','spec'])ro.observe($(id));}else addEventListener('resize',fit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
requestAnimationFrame(frame);
window.__lab={get sim(){return sim;},st,get spec(){return spec;},get audio(){return audio;},applySpec};
})();
</script>
